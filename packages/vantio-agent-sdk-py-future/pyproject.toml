[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantio_future"]

[tool.hatch.build.targets.sdist]
only-include = ["src/vantio_future", "fixtures"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
dev-mode-exact = true

[project]
name = "vantio-agent-sdk"
version = "PKG02-FUTURE-PYTHON-UNASSIGNED"
description = "PRIVATE future vantio-agent-sdk line for PKG-02 Unit E. Not 3.1.0. Not 3.0.15. Not published."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vantio AI, Inc." }]
requires-python = ">=3.12"
classifiers = [
  "Private :: Do Not Upload",
]
