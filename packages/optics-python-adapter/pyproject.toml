[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optics_python_adapter"]

[tool.hatch.build.targets.sdist]
only-include = ["src/optics_python_adapter"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[project]
name = "vantio-optics-python-adapter"
version = "0.0.0-unstable-pre-1.0"
description = "PRIVATE | INERT | NOT SHIPPED | NO LIVE WRITER | NO LIVE READER | NO MIGRATION | NO STABLE SCHEMA. PKG-02 Unit C inert Python adapter."
readme = "README.md"
license = "LicenseRef-proprietary"
authors = [{ name = "Vantio AI, Inc." }]
requires-python = ">=3.12"
classifiers = [
  "Private :: Do Not Upload",
]

[tool.hatch.build]
dev-mode-exact = true
