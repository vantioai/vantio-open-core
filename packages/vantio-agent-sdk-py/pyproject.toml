[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantio-agent-sdk"
version = "0.1.0"
description = "[ ∅ VANTIO ] Python agent SDK — zero-line AI governance telemetry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["vantio", "ai", "governance", "security", "ebpf", "tracing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage   = "https://vantio.ai"
Repository = "https://github.com/vantioai/vantio-open-core"
