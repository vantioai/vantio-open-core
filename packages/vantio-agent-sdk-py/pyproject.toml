[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantio"]

[project]
name = "vantio-agent-sdk"
version = "3.0.0"
description = "[ ∅ VANTIO ] Python agent SDK — SDK-side AI governance: shield(), report_anomaly(), opt-out telemetry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["vantio", "ai", "governance", "security", "ebpf", "tracing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage   = "https://vantio.ai"
Repository = "https://github.com/vantioai/vantio-open-core"
