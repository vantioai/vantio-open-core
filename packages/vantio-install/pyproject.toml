[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vantio_install"]

[project]
name = "vantio-install"
version = "0.1.0-stage-a"
description = "Transactional installer for a Vantio node. Observe-only by default. Separate from the frozen Optics CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vantio AI, Inc.", email = "hello@vantio.ai" }]
requires-python = ">=3.10"
keywords = ["vantio", "installer", "optics", "phantom-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
vantio-install = "vantio_install.cli:main"
vantio-verify = "vantio_install.verifier:main"
