name: W3 lab auto long soak

# Launch one Free-lab host whose life tag is 36 hours, then exit.
# A later collect workflow reads it. This file does not stay online for the soak.
# max_life_hours_36 is read from lab_iam_capabilities.json. execute defaults
# false. Termination protection stays off: disable_api_termination is false
# because the sweeper role cannot clear it.
# Trust subject, after the switch is true and this file is on main:
#   repo:vantioai/vantio-open-core:environment:w3-lab-auto
# Billing role stays on the cost-gate workflow. Launch uses vantio-w3-lab-provision.

on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: Hours until expiry. 8 through 36. Seven hours and under use the provision workflow.
        required: true
        default: "36"
        type: string
      instance_type:
        description: Free-eligible amd64 type.
        required: true
        default: t3.micro
        type: choice
        options:
          - t3.micro
          - t3.small
      associate_public_ipv4:
        description: Assign a public IPv4 so a later arm can open SSH for one runner address.
        required: true
        default: false
        type: boolean
      execute:
        description: Leave false. True launches only when the 36-hour capability switch is also true.
        required: true
        default: false
        type: boolean
      image_id:
        description: Ubuntu pin ami-0fa99aa8f97f9e30b, or the official Debian 12 amd64 id from the sitting summary.
        required: false
        default: ami-0fa99aa8f97f9e30b
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantio-lab-slot
  cancel-in-progress: false

jobs:
  preflight:
    name: Refuse until the 36-hour tag is recorded
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    outputs:
      proceed: ${{ steps.cap.outputs.proceed }}
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/w3-lab-auto-long-soak.yml@refs/heads/main"

      - name: Checkout the capability switch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_auto.py
            scripts/aws/w3_lab_steps.py
            scripts/aws/lab-guests/webshell_grade.py
            scripts/aws/lab_iam_capabilities.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 15
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Read the capability switch
        id: cap
        env:
          SOAK_HOURS: ${{ inputs.soak_hours }}
          EXECUTE: ${{ inputs.execute }}
          EVIDENCE_PATH: w3-lab-long-soak.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py preflight-long-soak

      - name: Upload the preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-long-soak-preflight-${{ github.run_id }}
          path: |
            w3-lab-long-soak.json
            w3-lab-long-soak.json.sha256
          if-no-files-found: error

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-w3-lab-auto-long-soak-preflight
          path: optics-observe-log
          if-no-files-found: warn

  gate:
    name: Pre-run cost check
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    uses: vantioai/vantio-open-core/.github/workflows/w3-lab-auto-cost-gate.yml@main # oidc-trust
    permissions:
      contents: read
      id-token: write

  launch:
    name: Launch one 36-hour lab and exit
    needs: [preflight, gate]
    if: needs.preflight.outputs.proceed == 'true' && needs.gate.outputs.expected_oop_usd == '0'
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: w3-lab-auto
    timeout-minutes: 30
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Refuse static AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "static AWS credentials are present" >&2
            exit 1
          fi

      - name: Checkout launch script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_auto.py
            scripts/aws/lab_iam_capabilities.json
            scripts/aws/lab-guests/record-check.sh
            scripts/aws/lab-guests/soak-hourly.sh
          sparse-checkout-cone-mode: false

      - name: Assume vantio-w3-lab-provision
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::960577828987:role/vantio-w3-lab-provision
          role-session-name: w3-lab-auto-long-soak-${{ github.run_id }}
          aws-region: us-east-2
          role-duration-seconds: "3600"
          audience: sts.amazonaws.com
          allowed-account-ids: "960577828987"
          use-existing-credentials: false
          output-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 15
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Launch one tagged lab and exit
        env:
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          STOP_AFTER_MINUTES: "2400"
          MAX_LIFE_HOURS: "36"
          # The soak tag keeps the sweeper off this host. Termination protection
          # stays off, because the sweeper role cannot clear it at teardown.
          SOAK: "true"
          ASSOCIATE_PUBLIC_IPV4: ${{ inputs.associate_public_ipv4 }}
          IMAGE_ID: ${{ inputs.image_id }}
          COST_GATE_JSON: ${{ needs.gate.outputs.gate_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COST_GATE_JSON" > "$RUNNER_TEMP/cost-gate.json"
          COST_GATE_FILE="$RUNNER_TEMP/cost-gate.json" vantio run python3 scripts/aws/w3_lab_auto.py launch

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-long-soak-launch-${{ github.run_id }}
          path: |
            w3-lab-auto-launch.json
            w3-lab-auto-launch.json.sha256
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-w3-lab-auto-long-soak-launch
          path: optics-observe-log
          if-no-files-found: warn
