name: Publish to PyPI

# Governed production path for vantio-agent-sdk 3.1.1 Trusted Publishing.
#
# Trigger: workflow_dispatch only. Dispatch inputs are absent. Package name,
# version, filenames, byte lengths, SHA-256, and the custody tag are pinned
# here and in scripts/release/stage_sealed_pypi.py. An operator cannot
# replace them at dispatch time.
#
# Upload client: pypa/gh-action-pypi-publish@release/v1
# The action exchanges a GitHub OIDC token for a short-lived PyPI token only
# when no password is supplied and the user stays the default __token__.
# The id-token write permission is required for that exchange. It is not, by itself, the
# upload client. This job sets neither user nor password.
#
# Custody: gh release download of tag custody-py-3.1.1 in
# vantioai/vantio-open-core, via scripts/release/fetch_custody_release.py.
# This workflow does not create that tag and does not upload the release assets.
# scripts/release/prepare_custody_py_3_1_1.py prints the operator command and refuses to run it.
# That tag is a GitHub Release selector. Release assets can be replaced and
# the tag can be moved by a principal with contents write. This workflow does
# not treat the tag as immutable. The pinned SHA-256 and byte length are the
# integrity gate. Download failure, a missing file, an extra file, or a hash
# mismatch fails the job before the upload action.
#
# The publish job checks out only the custody fetch script and the stage
# script. It does not check out package source and it does not build.
# The action receives only pypi-sealed-upload, which is created after the
# sealed bytes are verified.
# The version lookup runs before that directory is created. The upload action
# is the next step after staging.
#
# skip-existing is false. PyPI 3.1.1 already existing stops the job before
# the upload action. The action is also configured with skip-existing false,
# so a race that publishes first still fails the upload.
#
# The action's attestations input is left unset. Its default is true, so a
# real publication can generate PEP 740 attestations. This workflow does not
# add attestations itself. No attestation is claimed until a publication runs.
#
# DISPOSITION: scripts/release/promote_pypi.py is unchanged. It is not called.
# It is not the authorized Trusted Publisher upload path.
#
# Environment pypi is required. Required reviewers and the main-only
# deployment branch policy are configured on the GitHub environment, outside
# this file.
#
# Failure before the upload action leaves PyPI unchanged. This workflow does
# not retry a failed upload and does not yank.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-vantio-agent-sdk-3.1.1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish sealed vantio-agent-sdk 3.1.1
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment:
      name: pypi
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/fetch_custody_release.py
            scripts/release/stage_sealed_pypi.py
          sparse-checkout-cone-mode: false

      - name: Require the trusted-publisher workflow identity
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/pypi-publish.yml@refs/heads/main"
          test ! -e packages
          test ! -e packages/vantio-agent-sdk-py
          test ! -e packages/vantio-cli
          test ! -e packages/optics-evidence-contract
          test ! -e dist
          test ! -e pypi-sealed-upload

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Stop when 3.1.1 is already on PyPI
        env:
          VANTIO_STAGE_ENFORCE_ACTIONS_CONTEXT: "1"
        run: |
          set -euo pipefail
          vantio run python3 scripts/release/stage_sealed_pypi.py --reject-existing-version

      - name: Download sealed custody assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vantio run python3 scripts/release/fetch_custody_release.py \
            --tag custody-py-3.1.1 \
            --version 3.1.1 \
            --wheel-name vantio_agent_sdk-3.1.1-py3-none-any.whl \
            --sdist-name vantio_agent_sdk-3.1.1.tar.gz \
            --dest "$RUNNER_TEMP/sealed-custody"

      - name: Verify sealed bytes and stage the upload directory
        env:
          SEALED_PACKAGE: vantio-agent-sdk
          SEALED_VERSION: "3.1.1"
          SEALED_WHEEL_NAME: vantio_agent_sdk-3.1.1-py3-none-any.whl
          SEALED_SDIST_NAME: vantio_agent_sdk-3.1.1.tar.gz
          SEALED_WHEEL_SHA256: 6a0e4aff4c3d520df0016ae2d56c97fd2c5a7a09e184edd63c59044f558685b8
          SEALED_SDIST_SHA256: 8a03682afd2058788bd044fbd3784d3b837067bf5ff189d6be5b09434ec96799
          SEALED_WHEEL_BYTES: "33997"
          SEALED_SDIST_BYTES: "57039"
          VANTIO_STAGE_ENFORCE_ACTIONS_CONTEXT: "1"
        run: |
          set -euo pipefail
          vantio run python3 scripts/release/stage_sealed_pypi.py \
            --source "$RUNNER_TEMP/sealed-custody" \
            --upload-dir "$GITHUB_WORKSPACE/pypi-sealed-upload"

      - name: Publish sealed distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-sealed-upload
          verbose: false
          print-hash: false
          skip-existing: false

      - name: Record publication coordinates
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          package=vantio-agent-sdk
          version=3.1.1
          wheel=vantio_agent_sdk-3.1.1-py3-none-any.whl
          wheel_bytes=33997
          wheel_sha256=6a0e4aff4c3d520df0016ae2d56c97fd2c5a7a09e184edd63c59044f558685b8
          sdist=vantio_agent_sdk-3.1.1.tar.gz
          sdist_bytes=57039
          sdist_sha256=8a03682afd2058788bd044fbd3784d3b837067bf5ff189d6be5b09434ec96799
          environment=pypi
          upload_client=pypa/gh-action-pypi-publish@release/v1
          EOF

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-pypi-publish
          path: optics-observe-log
          if-no-files-found: warn
