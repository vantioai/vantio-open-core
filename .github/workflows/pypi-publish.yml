name: Publish to PyPI

# Governed production path for vantio-agent-sdk 3.1.0 Trusted Publishing.
#
# Trigger: workflow_dispatch only. Dispatch inputs are absent. Package name,
# version, filenames, byte lengths, SHA-256, and the custody tag are pinned
# here and in scripts/release/stage_sealed_pypi.py. An operator cannot
# replace them at dispatch time.
#
# Upload client: pypa/gh-action-pypi-publish@release/v1
# The action exchanges a GitHub OIDC token for a short-lived PyPI token only
# when no password is supplied and the user stays the default __token__.
# The id-token write permission is required for that exchange. It is not, by itself, the
# upload client. This job sets neither user nor password.
#
# Custody: gh release download of tag custody-py-3.1.0 in
# vantioai/vantio-open-core, via scripts/release/fetch_custody_release.py.
# That tag is a GitHub Release selector. Release assets can be replaced and
# the tag can be moved by a principal with contents write. This workflow does
# not treat the tag as immutable. The pinned SHA-256 and byte length are the
# integrity gate. Download failure, a missing file, an extra file, or a hash
# mismatch fails the job before the upload action.
#
# The publish job checks out only the custody fetch script and the stage
# script. It does not check out package source and it does not build.
# The action receives only pypi-sealed-upload, which is created after the
# sealed bytes are verified.
# The version lookup runs before that directory is created. The upload action
# is the next step after staging.
#
# skip-existing is false. PyPI 3.1.0 already existing stops the job before
# the upload action. The action is also configured with skip-existing false,
# so a race that publishes first still fails the upload.
#
# The action's attestations input is left unset. Its default is true, so a
# real publication can generate PEP 740 attestations. This workflow does not
# add attestations itself. No attestation is claimed until a publication runs.
#
# DISPOSITION: scripts/release/promote_pypi.py is unchanged. It is not called.
# It is not the authorized Trusted Publisher upload path.
#
# Environment pypi is required. Required reviewers and the main-only
# deployment branch policy are configured on the GitHub environment, outside
# this file.
#
# Failure before the upload action leaves PyPI unchanged. This workflow does
# not retry a failed upload and does not yank.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-vantio-agent-sdk-3.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish sealed vantio-agent-sdk 3.1.0
    runs-on: ubuntu-latest
    environment:
      name: pypi
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/fetch_custody_release.py
            scripts/release/stage_sealed_pypi.py
          sparse-checkout-cone-mode: false

      - name: Require the trusted-publisher workflow identity
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/pypi-publish.yml@refs/heads/main"
          test ! -e packages
          test ! -e packages/vantio-agent-sdk-py
          test ! -e packages/vantio-cli
          test ! -e packages/optics-evidence-contract
          test ! -e dist
          test ! -e pypi-sealed-upload

      - name: Stop when 3.1.0 is already on PyPI
        env:
          VANTIO_STAGE_ENFORCE_ACTIONS_CONTEXT: "1"
        run: |
          set -euo pipefail
          python3 scripts/release/stage_sealed_pypi.py --reject-existing-version

      - name: Download sealed custody assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release/fetch_custody_release.py \
            --tag custody-py-3.1.0 \
            --version 3.1.0 \
            --wheel-name vantio_agent_sdk-3.1.0-py3-none-any.whl \
            --sdist-name vantio_agent_sdk-3.1.0.tar.gz \
            --dest "$RUNNER_TEMP/sealed-custody"

      - name: Verify sealed bytes and stage the upload directory
        env:
          SEALED_PACKAGE: vantio-agent-sdk
          SEALED_VERSION: "3.1.0"
          SEALED_WHEEL_NAME: vantio_agent_sdk-3.1.0-py3-none-any.whl
          SEALED_SDIST_NAME: vantio_agent_sdk-3.1.0.tar.gz
          SEALED_WHEEL_SHA256: dcf84cb3c4f144ece21032001657bfd9c91067faeffbefd0fb2ae19d6109dbeb
          SEALED_SDIST_SHA256: 9f991291d5e44a23e17a9b0d7db24f6e7048d4c76cf0a9c37e35ccbcfe999c4f
          SEALED_WHEEL_BYTES: "39235"
          SEALED_SDIST_BYTES: "59669"
          VANTIO_STAGE_ENFORCE_ACTIONS_CONTEXT: "1"
        run: |
          set -euo pipefail
          python3 scripts/release/stage_sealed_pypi.py \
            --source "$RUNNER_TEMP/sealed-custody" \
            --upload-dir "$GITHUB_WORKSPACE/pypi-sealed-upload"

      - name: Publish sealed distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-sealed-upload
          verbose: false
          print-hash: false
          skip-existing: false

      - name: Record publication coordinates
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          package=vantio-agent-sdk
          version=3.1.0
          wheel=vantio_agent_sdk-3.1.0-py3-none-any.whl
          wheel_bytes=39235
          wheel_sha256=dcf84cb3c4f144ece21032001657bfd9c91067faeffbefd0fb2ae19d6109dbeb
          sdist=vantio_agent_sdk-3.1.0.tar.gz
          sdist_bytes=59669
          sdist_sha256=9f991291d5e44a23e17a9b0d7db24f6e7048d4c76cf0a9c37e35ccbcfe999c4f
          environment=pypi
          upload_client=pypa/gh-action-pypi-publish@release/v1
          EOF
