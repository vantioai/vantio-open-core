name: SLSA L3 Provenance Build

on:
  release:
    types: [created]

permissions:
  id-token: write      # Required for OIDC Workload Identity Federation
  contents: read       # Required to checkout the repository
  attestations: write  # Required to write the Sigstore provenance

jobs:
  build-and-attest:
    name: Build & Generate Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Vantio CLI Binary
        run: cargo build --release -p vantio-cli

      - name: Generate Sigstore Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'packages/vantio-cli/target/release/vantio'
