name: Publish to MCP Registry

# Manual dispatch for one allowlisted MCP package.
# Ordinary pushes and pull-request merges do not run this workflow.
# A duplicate registry version is VERSION_ALREADY_EXISTS, not a success.

on:
  workflow_dispatch:
    inputs:
      package:
        description: MCP package directory
        required: true
        type: choice
        options:
          - vantio-optics-mcp
          - vantio-gate-mcp

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP registry metadata
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject unknown package
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          case "$INPUT_PACKAGE" in
            vantio-optics-mcp|vantio-gate-mcp) ;;
            *) echo "vantio-release: package is not on the MCP allowlist" >&2; exit 1 ;;
          esac
          test -f "packages/$INPUT_PACKAGE/server.json"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: mcp-publisher validate

      - name: Wait for npm package version
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: |
          set -eu
          IDENT=$(node -p "require('./server.json').packages[0].identifier")
          VER=$(node -p "require('./server.json').packages[0].version")
          echo "Waiting for $IDENT@$VER on npm before MCP registry publish."
          for i in $(seq 1 18); do
            if npm view "$IDENT@$VER" version >/dev/null 2>&1; then
              echo "Found $IDENT@$VER"
              exit 0
            fi
            echo "Attempt $i/18: $IDENT@$VER not on npm yet; sleeping 10s"
            sleep 10
          done
          echo "::error::$IDENT@$VER was not found on npm after waiting. Publish the npm package first."
          exit 1

      - name: Publish to MCP Registry
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: |
          set -eu
          set -o pipefail
          for attempt in 1 2 3 4 5 6; do
            if OUTPUT=$(mcp-publisher publish 2>&1); then
              echo "$OUTPUT"
              exit 0
            fi
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qiE 'duplicate version|cannot publish duplicate'; then
              echo "VERSION_ALREADY_EXISTS"
              echo "::error::MCP registry already has this version. Not a successful publication."
              exit 2
            fi
            if echo "$OUTPUT" | grep -qiE 'was not found \(status: 404\)|newly published release can take a moment'; then
              echo "MCP registry still does not see the npm version (attempt $attempt/6). Retrying in 15s."
              sleep 15
              continue
            fi
            echo "::error::MCP registry publish failed for $INPUT_PACKAGE"
            exit 1
          done
          echo "::error::MCP registry publish failed for $INPUT_PACKAGE after waiting for npm"
          exit 1
