# MCP registry update is separately gated from ordinary merges.
# Ordinary main merges must NOT publish. Publication requires an explicit
# workflow_dispatch; a separate npm publication must have already landed.
name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      package:
        description: "MCP package to publish (exactly one)"
        required: true
        type: choice
        options:
          - vantio-optics-mcp
          - vantio-gate-mcp
      version:
        description: "Version to publish — must match server.json packages[0].version"
        required: true
        type: string
      git_sha:
        description: "Commit SHA being published — must equal the checked-out commit SHA"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP registry metadata (${{ inputs.package }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Fail-closed pre-flight before any registry call.
      # -----------------------------------------------------------------------

      - name: Validate git_sha matches checked-out commit
        run: |
          ACTUAL_SHA="${{ github.sha }}"
          INPUT_SHA="${{ inputs.git_sha }}"
          if [ "$INPUT_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::git_sha input ('$INPUT_SHA') does not match the checked-out commit ('$ACTUAL_SHA'). Aborting."
            exit 1
          fi
          echo "git_sha OK: $ACTUAL_SHA"

      - name: Validate version matches server.json
        working-directory: packages/${{ inputs.package }}
        run: |
          SERVER_VER=$(node -p "require('./server.json').packages[0].version")
          INPUT_VER="${{ inputs.version }}"
          if [ "$INPUT_VER" != "$SERVER_VER" ]; then
            echo "::error::version input ('$INPUT_VER') does not match server.json version ('$SERVER_VER'). Aborting."
            exit 1
          fi
          echo "version OK: $SERVER_VER"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        working-directory: packages/${{ inputs.package }}
        run: mcp-publisher validate

      # MCP Registry refuses a version until that exact npm tarball exists.
      # The corresponding npm publish must have been dispatched and completed
      # before dispatching this workflow.
      - name: Wait for npm package version
        working-directory: packages/${{ inputs.package }}
        run: |
          IDENT=$(node -p "require('./server.json').packages[0].identifier")
          VER=$(node -p "require('./server.json').packages[0].version")
          echo "Waiting for $IDENT@$VER on npm before MCP registry publish."
          for i in $(seq 1 18); do
            if npm view "$IDENT@$VER" version >/dev/null 2>&1; then
              echo "Found $IDENT@$VER"
              exit 0
            fi
            echo "Attempt $i/18: $IDENT@$VER not on npm yet; sleeping 10s"
            sleep 10
          done
          echo "::error::$IDENT@$VER was not found on npm after waiting. Publish the npm package first."
          exit 1

      - name: Publish to MCP Registry
        working-directory: packages/${{ inputs.package }}
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5 6; do
            OUTPUT=$(mcp-publisher publish 2>&1) && { echo "$OUTPUT"; exit 0; }
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qiE 'duplicate version|cannot publish duplicate'; then
              echo "Version already published — expected on re-runs."
              exit 0
            fi
            if echo "$OUTPUT" | grep -qiE 'was not found \(status: 404\)|newly published release can take a moment'; then
              echo "MCP registry still does not see the npm version (attempt $attempt/6). Retrying in 15s."
              sleep 15
              continue
            fi
            echo "::error::MCP registry publish failed for ${{ inputs.package }}"
            exit 1
          done
          echo "::error::MCP registry publish failed for ${{ inputs.package }} after waiting for npm"
          exit 1
