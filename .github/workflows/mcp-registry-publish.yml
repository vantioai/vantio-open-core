name: Publish to MCP Registry

# Manual dispatch for one allowlisted MCP package.
# Ordinary pushes and pull-request merges do not run this workflow.
# A duplicate registry version is VERSION_ALREADY_EXISTS, not a success.

on:
  workflow_dispatch:
    inputs:
      package:
        description: MCP package directory
        required: true
        type: choice
        options:
          - vantio-optics-mcp
          - vantio-gate-mcp

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP registry metadata
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: mcp-registry-publish
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject unknown package
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          case "$INPUT_PACKAGE" in
            vantio-optics-mcp|vantio-gate-mcp) ;;
            *) echo "vantio-release: package is not on the MCP allowlist" >&2; exit 1 ;;
          esac
          test -f "packages/$INPUT_PACKAGE/server.json"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Authenticate (GitHub OIDC)
        run: vantio run mcp-publisher login github-oidc

      - name: Validate server.json
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: vantio run mcp-publisher validate

      - name: Wait for npm package version
        id: npm-wait
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: |
          set -eu
          IDENT=$(vantio run node -p "require('./server.json').packages[0].identifier")
          VER=$(vantio run node -p "require('./server.json').packages[0].version")
          echo "Waiting for $IDENT@$VER on npm before MCP registry publish."
          for i in $(seq 1 18); do
            if vantio run npm view "$IDENT@$VER" version >/dev/null 2>&1; then
              echo "Found $IDENT@$VER"
              exit 0
            fi
            echo "Attempt $i/18: $IDENT@$VER not on npm yet; sleeping 10s"
            sleep 10
          done
          echo "::error::$IDENT@$VER was not found on npm after waiting. Publish the npm package first."
          exit 1

      - name: Publish to MCP Registry
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        working-directory: packages/${{ inputs.package }}
        run: |
          set -eu
          set -o pipefail
          for attempt in 1 2 3 4 5 6; do
            if OUTPUT=$(vantio run mcp-publisher publish 2>&1); then
              echo "$OUTPUT"
              exit 0
            fi
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qiE 'duplicate version|cannot publish duplicate'; then
              echo "VERSION_ALREADY_EXISTS"
              echo "::error::MCP registry already has this version. Not a successful publication."
              exit 2
            fi
            if echo "$OUTPUT" | grep -qiE 'was not found \(status: 404\)|newly published release can take a moment'; then
              echo "MCP registry still does not see the npm version (attempt $attempt/6). Retrying in 15s."
              sleep 15
              continue
            fi
            echo "::error::MCP registry publish failed for $INPUT_PACKAGE"
            exit 1
          done
          echo "::error::MCP registry publish failed for $INPUT_PACKAGE after waiting for npm"
          exit 1

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
            if [ "${{ steps.npm-wait.outcome }}" = "success" ] || [ "${{ steps.npm-wait.outcome }}" = "failure" ]; then
              exit 1
            fi
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-mcp-publish
          path: optics-observe-log
          if-no-files-found: warn
