name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

env:
  # Deployment-partner name substrings for the leak guards, comma-separated. Set as a repo variable, never in code.
  VANTIO_PARTNER_MARKERS: ${{ vars.VANTIO_PARTNER_MARKERS }}

jobs:
  lint-and-test-js:
    name: Lint, typecheck, and test (CLI + Node SDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Do not pin `version:` here — it conflicts with package.json packageManager
        # (pnpm/action-setup v4 fails the job before tests or publish can run).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Lint @vantio/cli
        run: pnpm --filter @vantio/cli run lint

      - name: Typecheck @vantio/agent-sdk (src)
        run: pnpm --filter @vantio/agent-sdk run typecheck

      - name: Typecheck @vantio/agent-sdk (tests)
        run: pnpm --filter @vantio/agent-sdk run typecheck:test

      - name: Test @vantio/cli
        run: pnpm --filter @vantio/cli run test

      - name: Test @vantio/gate-mcp
        run: pnpm --filter @vantio/gate-mcp test

      - name: Test MCP awareness (T4, no install)
        run: node --test packages/vantio-mcp-awareness/test/*.test.js && node packages/vantio-mcp-awareness/scripts/proof.mjs

      - name: Test @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run test

      - name: Build @vantio/agent-sdk (verify dist output is producible)
        run: pnpm --filter @vantio/agent-sdk run build

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-lint-and-test-js
          path: optics-observe-log
          if-no-files-found: warn

  test-python:
    name: Test Python SDK (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional HTTP clients the observe tests exercise
        run: python -m pip install --disable-pip-version-check requests httpx aiohttp urllib3

      - name: Run tests (stdlib unittest — the SDK itself has no install dependencies)
        working-directory: packages/vantio-agent-sdk-py
        run: python -m unittest discover -s tests -t . -v

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          ( cd packages/vantio-agent-sdk-py && vantio run python -m unittest discover -s tests -t . -v )
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-test-python-${{ matrix.python-version }}
          path: optics-observe-log
          if-no-files-found: warn

  release-governance:
    name: Release governance contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test release gates
        run: |
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.1'
          node --test scripts/release/governance.test.mjs
          node --test scripts/release/ws11/ws11.test.mjs
          node --test scripts/release/seal-identity-recheck.test.mjs
          node --test scripts/release/engine-archive-rebuild.test.mjs
          node --test scripts/release/pe-canonical-seal.test.mjs
          python3 scripts/release/test_pe_canonical_seal.py -v
          python3 scripts/aws/test_webshell_grade.py -v
          python3 scripts/release/test_promote_pypi.py -v
          python3 scripts/release/test_pypi_publish_workflow.py -v
          python3 scripts/release/test_optics_release_observe.py -v
          python3 scripts/aws/test_verify_w3_lab_teardown.py -v
          python3 scripts/aws/test_preflight_w3_lab_teardown.py -v
          python3 scripts/aws/test_w3_lab_teardown_workflow.py -v
          python3 scripts/aws/test_w3_lab_auto.py -v
          python3 scripts/aws/test_w3_lab_steps.py -v
          python3 scripts/aws/test_phase2_grade.py -v
          python3 scripts/aws/test_descendant_banner.py -v
          python3 scripts/aws/test_lab_oidc_trigger.py -v
          python3 scripts/aws/test_w3_lab_eip.py -v
          python3 scripts/gcp/test_lab_auto.py -v
          python3 scripts/gcp/test_offline_deliver.py -v
          python3 scripts/gcp/test_redteam_packet.py -v
          python3 scripts/gcp/test_redteam_brain.py -v
          python3 tests/planning/test_r15_lifecycle.py -v
          python3 scripts/ci/test_optics_observe_ci.py -v

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-release-governance
          path: optics-observe-log
          if-no-files-found: warn

  candidate-artifacts:
    name: Build release candidates (no registry write)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack @vantio/cli candidate
        working-directory: packages/vantio-cli
        run: |
          mkdir -p "$RUNNER_TEMP/candidates"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidates"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build Python sdist and wheel candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidates-py"
          python3 -m pip install --disable-pip-version-check build
          python3 -m build --outdir "$RUNNER_TEMP/candidates-py" packages/vantio-agent-sdk-py

      - name: Upload candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidates
          path: |
            ${{ runner.temp }}/candidates
            ${{ runner.temp }}/candidates-py
          if-no-files-found: error

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-candidate-artifacts
          path: optics-observe-log
          if-no-files-found: warn

  test-vantio-install:
    name: Test vantio-install (Stage A fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile and test vantio-install
        working-directory: packages/vantio-install
        run: |
          python -m pip install --require-hashes --disable-pip-version-check -r requirements/dev-hashes.txt
          python -m compileall -q vantio_install
          python -m unittest discover -s tests -t . -v

      - name: Test Optics docker observe example
        run: python -m unittest deploy/docker/test_observe_example.py -v

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-test-vantio-install
          path: optics-observe-log
          if-no-files-found: warn

  test-openshell-reconciliation:
    name: Test OpenShell reconciliation fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test the lab join and run the bypass proof
        run: |
          node --test internal/gap-t2-openshell/test/*.test.cjs
          node internal/gap-t2-openshell/proof/prove-bypass.cjs

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-test-openshell-reconciliation
          path: optics-observe-log
          if-no-files-found: warn

  test-optics-agent-inventory:
    name: Test Optics agent inventory fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fixture tests
        run: python3 -m unittest discover -s tests/optics-agent-inventory -t tests/optics-agent-inventory -v

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-test-optics-agent-inventory
          path: optics-observe-log
          if-no-files-found: warn

  test-t5-kernel:
    name: Test T5 kernel model and battery id
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang gcc libbpf-dev

      - name: Model, compile, and battery allow-list
        run: |
          python3 packages/t5-egress-kernel/tests/test_kernel_model.py -v
          python3 scripts/clean-host/t5/kernel_proof.py
          python3 scripts/aws/test_t5_battery.py -v
          python3 scripts/gcp/test_t5_battery.py -v
          gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/t5_load" scripts/clean-host/t5/t5_load.c -lbpf -lelf -lz
          "$RUNNER_TEMP/t5_load" path-check /sys/fs/cgroup/vantio-t5-lab.slice/t5-drill
          if "$RUNNER_TEMP/t5_load" path-check /sys/fs/cgroup/vantio-enrolled.slice; then exit 1; fi
          if VANTIO_PARTNER_MARKERS=" T5-Drill " "$RUNNER_TEMP/t5_load" path-check /sys/fs/cgroup/vantio-t5-lab.slice/t5-drill; then exit 1; fi

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-test-t5-kernel
          path: optics-observe-log
          if-no-files-found: warn
