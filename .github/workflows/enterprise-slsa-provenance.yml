name: SLSA L3 Enterprise Provenance

on:
  push:
    branches: [main]

permissions:
  id-token:     write
  contents:     read
  attestations: write

jobs:
  build-and-attest:
    name: Build, bundle, and attest provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # SLSA L3 requires a hermetic build: the dependency graph must not mutate
        # at build time. --frozen-lockfile fails the build on any lockfile drift,
        # which is the property the provenance attestation below is asserting.
        run: pnpm install --frozen-lockfile

      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      - name: Build @vantio/edge-proxy
        run: pnpm --filter @vantio/edge-proxy run build

      - name: Bundle artifacts
        run: |
          tar -czf vantio-artifacts.tar.gz \
            packages/vantio-agent-sdk/dist \
            packages/edge-proxy/dist \
            packages/vantio-cli/bin

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: vantio-artifacts.tar.gz
