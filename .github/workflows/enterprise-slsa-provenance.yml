name: SLSA Enterprise Provenance

# Tagged releases *can* produce GitHub attest-build-provenance artifacts.
# That does NOT make slsa_verified=true in-repo until subjects are copied
# under logs/dogfood/evidence/slsa_attestations/ and the verify checklist passes.
# Do not claim SLSA Level X verified from this workflow alone.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this provenance build was triggered"
        required: false
        default: "manual provenance rebuild"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build-and-attest:
    name: Build, bundle, and attest provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Do not pin `version:` here — it conflicts with package.json packageManager.

      - name: Install dependencies
        # Hermetic intent: frozen lockfile fails on drift (SLSA L3-oriented property).
        # Target level for releases = L3; do not claim verified until checklist subjects exist.
        run: pnpm install --frozen-lockfile

      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      # NOTE: @vantio/edge-proxy was removed from this repo — open-core is SDK/CLI only.

      - name: Bundle artifacts
        run: |
          tar -czf vantio-artifacts.tar.gz \
            packages/vantio-agent-sdk/dist \
            packages/vantio-cli/bin
          sha256sum vantio-artifacts.tar.gz | tee vantio-artifacts.sha256

      - name: Upload release bundle (tags + manual)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vantio-artifacts-${{ github.sha }}
          path: |
            vantio-artifacts.tar.gz
            vantio-artifacts.sha256
          if-no-files-found: error

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: vantio-artifacts.tar.gz

      - name: Provenance honesty note
        run: |
          echo "Attestation step completed (GitHub attestations API)."
          echo "In-repo slsa_verified stays false until subjects are verified via:"
          echo "  python3 scripts/slsa_verify_checklist.py --require-verified"
          echo "Required release target level: SLSA 3 (not verified Present)."
          if [ -n "${{ steps.attest.outputs.bundle-path }}" ]; then
            echo "bundle-path=${{ steps.attest.outputs.bundle-path }}"
          fi
