name: GCP lab provision

# Offline Phantom Engine delivery for t311u item 2, updated by t313u.
# One Ubuntu 24.04 e2-micro on vantio-lab-offline, no public IP, over IAP.
# The expected seal digest and bundle commit are workflow inputs.
# run_batteries is refused for f882dd81. The full digest is release/pe-seal-history.json.
# The guest accepts the loaded image vantio-phantom-engine:egress-2e6ab54.
# The sealed bundle goes to gs://vantio-lab-oct08-handoff and is deleted
# after the deliver job re-checks it. It is never a workflow artifact.
# Workload identity still requires this file on main:
#   vantioai/vantio-open-core/.github/workflows/gcp-lab-provision.yml@refs/heads/main
# Fetch uses environment w3-lab-auto and vantio-lab-handoff.
# Deliver and teardown use environment gcp-lab and vantio-lab-gha.

env:
  # Deployment-partner name substrings, comma-separated. Set as a repo variable, never in code.
  VANTIO_PARTNER_MARKERS: ${{ vars.VANTIO_PARTNER_MARKERS }}
  GCP_LAB_PROJECT: vantio-lab-oct08
  GCP_LAB_WIF_PROVIDER: projects/910881070503/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_LAB_SERVICE_ACCOUNT: vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com

on:
  workflow_dispatch:
    inputs:
      seal:
        description: Expected seal sha256, 64 hex characters.
        required: true
        type: string
      bundle_commit:
        description: Private bundle commit, 40 hex characters.
        required: false
        default: 75b6a94c1a50f07d3cc419a904ee08260c9c32ff
        type: string
      run_batteries:
        description: Run portable PE batteries after the digest check. Refused for f882dd81.
        required: false
        default: false
        type: boolean
      self_service:
        description: Run the public one-command installer. Does not run enterprise or descendant rows.
        required: false
        default: false
        type: boolean
      stop_after_minutes:
        description: Guest shutdown delay in minutes. 1 through 120.
        required: true
        default: "60"
        type: string
      redteam_brain:
        description: Pinned local Qwen on one e2-standard-4, then the kernel red-team rows. Default off.
        required: false
        default: false
        type: boolean
      t5_egress:
        description: Run battery t5-egress on the fresh VM. Does not run enterprise, descendant, self-service, or red-team rows.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantio-gce-slot
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch sealed bundle to private bucket
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: w3-lab-auto
    timeout-minutes: 40
    outputs:
      seal_sha256: ${{ steps.publish.outputs.seal_sha256 }}
      contract_sha256: ${{ steps.publish.outputs.contract_sha256 }}
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/gcp-lab-provision.yml@refs/heads/main"
          if [ "${{ inputs.self_service }}" = "true" ] && [ "${{ inputs.run_batteries }}" = "true" ]; then
            echo "self_service does not run the enterprise batteries" >&2
            exit 1
          fi
          if [ "${{ inputs.t5_egress }}" = "true" ] && { [ "${{ inputs.run_batteries }}" = "true" ] || [ "${{ inputs.self_service }}" = "true" ] || [ "${{ inputs.redteam_brain }}" = "true" ]; }; then
            echo "t5_egress does not run the other batteries" >&2
            exit 1
          fi

      - name: Refuse static cloud keys
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "static AWS credentials are present" >&2
            exit 1
          fi

      - name: Checkout bundle checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_steps.py
            scripts/aws/w3_lab_auto.py
            scripts/aws/enterprise_bundle.py
            scripts/aws/lab_iam_capabilities.json
            scripts/gcp/offline_deliver.py
            scripts/gcp/offline_deliver_1.py
            scripts/gcp/offline_deliver_2.py
            scripts/gcp/offline_deliver_3.py
            scripts/gcp/redteam_brain.py
            scripts/gcp/redteam_campaign.py
            scripts/gcp/redteam_packet.py
            scripts/gcp/lab_auto.py
            scripts/gcp/lab_capabilities.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Download and hash the local brain
        if: inputs.redteam_brain
        run: vantio run python3 scripts/gcp/redteam_brain.py fetch ${{ runner.temp }}/redteam-brain

      - name: Prepare and verify the private bundle
        env:
          W3_LAB_PRIVATE_BUNDLE_TOKEN: ${{ secrets.W3_LAB_PRIVATE_BUNDLE_TOKEN }}
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          W3_EXPECTED_SEAL: ${{ inputs.seal }}
          W3_BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          EXPECTED_SEAL: ${{ inputs.seal }}
          RUN_BATTERIES: ${{ inputs.run_batteries }}
          EVIDENCE_PATH: ${{ runner.temp }}/gcp-lab-evidence/prepare-bundle.json
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: |
          set -euo pipefail
          if [ -z "${W3_LAB_PRIVATE_BUNDLE_TOKEN}" ]; then
            echo "missing_token" >&2
            exit 2
          fi
          mkdir -p "$EVIDENCE_DIR"
          vantio run python3 scripts/gcp/offline_deliver.py check-dispatch
          vantio run python3 scripts/aws/w3_lab_steps.py prepare-bundle
          vantio run python3 scripts/gcp/offline_deliver.py assert-bundle

      - name: Require the vantio-lab-oct08 workload identity provider
        env:
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          test -n "$GCP_LAB_WIF_PROVIDER"
          vantio run python3 - << 'PY'
          import os, re, sys
          provider = os.environ["GCP_LAB_WIF_PROVIDER"]
          if re.fullmatch(r"projects/[0-9]{6,20}/locations/global/workloadIdentityPools/github-actions/providers/github", provider) is None:
              sys.exit("refusing provider")
          PY

      - name: Authenticate as the handoff writer
        id: handoff-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: vantio-lab-handoff@vantio-lab-oct08.iam.gserviceaccount.com

      - name: Confirm the handoff identity is vantio-lab-oct08
        run: |
          set -euo pipefail
          project="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT:-}}"
          test "$project" = "vantio-lab-oct08"

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Upload the bundle to the private handoff bucket
        id: publish
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: vantio-lab-oct08
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          EXPECTED_SEAL: ${{ inputs.seal }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          REDTEAM_BRAIN: ${{ inputs.redteam_brain == true && 'true' || 'false' }}
          BRAIN_DIR: ${{ runner.temp }}/redteam-brain
        run: vantio run python3 scripts/gcp/offline_deliver.py upload-handoff

      - name: Delete the local bundle
        if: always()
        run: rm -rf "${{ runner.temp }}/enterprise-bundle"

      - name: Keep only allowlisted evidence
        id: prune
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: vantio run python3 scripts/gcp/offline_deliver.py prune-evidence

      - name: Upload digest evidence
        if: always() && steps.prune.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-handoff-digests-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-evidence/
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-provision-fetch
          path: optics-observe-log
          if-no-files-found: warn

  gate:
    name: Pre-run cost check
    needs: fetch
    if: needs.fetch.result == 'success'
    uses: vantioai/vantio-open-core/.github/workflows/gcp-lab-cost-gate.yml@main # oidc-trust
    permissions:
      contents: read
      id-token: write

  deliver:
    name: Deliver offline VM
    needs: [fetch, gate]
    if: needs.fetch.result == 'success' && needs.gate.outputs.expected_oop_usd == '0'
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: gcp-lab
    timeout-minutes: 110
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/gcp-lab-provision.yml@refs/heads/main"
          test -n "${{ needs.fetch.outputs.seal_sha256 }}"
          test -n "${{ needs.fetch.outputs.contract_sha256 }}"
          if [ "${{ inputs.self_service }}" = "true" ] && [ "${{ inputs.run_batteries }}" = "true" ]; then
            echo "self_service does not run the enterprise batteries" >&2
            exit 1
          fi
          if [ "${{ inputs.t5_egress }}" = "true" ] && { [ "${{ inputs.run_batteries }}" = "true" ] || [ "${{ inputs.self_service }}" = "true" ] || [ "${{ inputs.redteam_brain }}" = "true" ]; }; then
            echo "t5_egress does not run the other batteries" >&2
            exit 1
          fi

      - name: Refuse static GCP keys
        env:
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
          GCP_LAB_SERVICE_ACCOUNT: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi
          test -n "$GCP_LAB_PROJECT"
          test -n "$GCP_LAB_WIF_PROVIDER"
          test -n "$GCP_LAB_SERVICE_ACCOUNT"
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"
          test "$GCP_LAB_SERVICE_ACCOUNT" = "vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com"

      - name: Checkout delivery scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/gcp/offline_deliver.py
            scripts/gcp/offline_deliver_1.py
            scripts/gcp/offline_deliver_2.py
            scripts/gcp/offline_deliver_3.py
            scripts/gcp/redteam_brain.py
            scripts/gcp/redteam_campaign.py
            scripts/gcp/redteam_packet.py
            scripts/gcp/lab_auto.py
            scripts/gcp/lab_capabilities.json
            scripts/gcp/fetch_offline_debs.sh
            scripts/gcp/lab-guests/enterprise-rows.sh
            scripts/gcp/lab-guests/redteam_rows.py
            scripts/gcp/lab-guests/stage_brain.py
            scripts/aws/lab-guests/descendant_b1.py
            scripts/aws/lab-guests/descendant_probe
            scripts/aws/lab-guests/phase2_host.py
            scripts/aws/lab-guests/phase2_grade.py
            scripts/aws/lab-guests/baseline_diag.py
            scripts/aws/lab-guests/sticky_write.py
            scripts/aws/lab-guests/self_service.py
            scripts/aws/lab-guests/t5-egress.sh
            scripts/clean-host/t5/
            packages/t5-egress-drills/
            packages/t5-egress-kernel/
            scripts/lab/stage_lab_trust.py
            packages/vantio-install/vantio_install/
            packages/vantio-install/requirements/dev-hashes.txt
          sparse-checkout-cone-mode: false

      - name: Authenticate as vantio-lab-gha
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Bind the provider to vantio-lab-oct08
        env:
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          number=$(vantio run gcloud projects describe vantio-lab-oct08 --format='value(projectNumber)')
          test -n "$number"
          test "$GCP_LAB_WIF_PROVIDER" = "projects/${number}/locations/global/workloadIdentityPools/github-actions/providers/github"

      - name: Cost gate
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          vantio run python3 scripts/gcp/lab_auto.py cost-gate | tee "$EVIDENCE_DIR/cost-gate.json"

      - name: Download the bundle, re-verify it, and delete it
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          FETCHED_SEAL: ${{ needs.fetch.outputs.seal_sha256 }}
          EXPECTED_CONTRACT_SHA256: ${{ needs.fetch.outputs.contract_sha256 }}
          REDTEAM_BRAIN: ${{ inputs.redteam_brain == true && 'true' || 'false' }}
          BRAIN_DIR: ${{ runner.temp }}/redteam-brain
        run: vantio run python3 scripts/gcp/offline_deliver.py download-handoff

      - name: Download pinned offline packages
        if: inputs.run_batteries || inputs.self_service
        env:
          DEB_DIR: ${{ runner.temp }}/offline-debs
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: |
          set -euo pipefail
          vantio run bash scripts/gcp/fetch_offline_debs.sh "$DEB_DIR"
          DEB_DIR="$DEB_DIR" vantio run python3 scripts/gcp/offline_deliver.py hash-debs

      - name: Create the offline VM
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_GATE_JSON: ${{ runner.temp }}/gcp-lab-evidence/cost-gate.json
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
          REDTEAM_BRAIN: ${{ inputs.redteam_brain == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          export GCP_LAB_GATE_JSON="$(cat "$GCP_LAB_GATE_JSON")"
          vantio run python3 scripts/gcp/offline_deliver.py create-instance

      - name: Copy the bundle over IAP and re-check the digest
        if: ${{ !inputs.run_batteries && !inputs.self_service && !inputs.t5_egress }}
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_GATE_JSON: ${{ runner.temp }}/gcp-lab-evidence/cost-gate.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          RUN_BATTERIES: "false"
          FETCHED_SEAL: ${{ needs.fetch.outputs.seal_sha256 }}
          EXPECTED_CONTRACT_SHA256: ${{ needs.fetch.outputs.contract_sha256 }}
          GUEST_SCRIPT: scripts/gcp/lab-guests/enterprise-rows.sh
        run: |
          set -euo pipefail
          export GCP_LAB_GATE_JSON="$(cat "$GCP_LAB_GATE_JSON")"
          vantio run python3 scripts/gcp/offline_deliver.py plumb-guest

      - name: Stage the lab installer and a non-production trust key
        if: inputs.self_service
        env:
          PYTHONPATH: packages/vantio-install
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --disable-pip-version-check -r packages/vantio-install/requirements/dev-hashes.txt
          dest="${{ runner.temp }}/self-service"
          pinned="${{ runner.temp }}/pinned-artifacts"
          mkdir -p "$dest" "$pinned"
          cp scripts/aws/lab-guests/self_service.py "$dest/self_service.py"
          cp -a packages/vantio-install/vantio_install "$dest/vantio_install"
          vantio run python3 scripts/lab/stage_lab_trust.py fetch "$pinned"
          vantio run python3 scripts/lab/stage_lab_trust.py stage "$dest" "$pinned"
          test -f "$dest/self-service.tar"
          vantio run python3 -c 'import json,pathlib,sys; p=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert p.get("audience")=="LAB_NONPROD" and p.get("not_a_production_root") is True' "$dest/lab-artifact-trust.json"

      - name: Run the self-service installer
        if: inputs.self_service
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          W3_SELF_SERVICE_DIR: ${{ runner.temp }}/self-service
          DEB_DIR: ${{ runner.temp }}/offline-debs
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          SELF_SERVICE: "true"
          RUN_BATTERIES: "false"
        run: vantio run python3 scripts/gcp/offline_deliver.py run-self-service

      - name: Run the kernel red-team campaign
        if: inputs.run_batteries && inputs.redteam_brain
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_GATE_JSON: ${{ runner.temp }}/gcp-lab-evidence/cost-gate.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          DEB_DIR: ${{ runner.temp }}/offline-debs
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          RUN_BATTERIES: "true"
          REDTEAM_BRAIN: "true"
          BRAIN_DIR: ${{ runner.temp }}/redteam-brain
          BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          FETCHED_SEAL: ${{ needs.fetch.outputs.seal_sha256 }}
          EXPECTED_CONTRACT_SHA256: ${{ needs.fetch.outputs.contract_sha256 }}
          GUEST_SCRIPT: scripts/gcp/lab-guests/enterprise-rows.sh
          DESCENDANT_SCRIPT: scripts/aws/lab-guests/descendant_b1.py
          REDTEAM_ROWS: scripts/gcp/lab-guests/redteam_rows.py
          REDTEAM_PACKET: scripts/gcp/redteam_packet.py
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
        run: |
          set -euo pipefail
          export GCP_LAB_GATE_JSON="$(cat "$GCP_LAB_GATE_JSON")"
          vantio run python3 scripts/gcp/offline_deliver.py run-redteam

      - name: Run the batteries on a new seal
        if: inputs.run_batteries && !inputs.redteam_brain
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_GATE_JSON: ${{ runner.temp }}/gcp-lab-evidence/cost-gate.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          DEB_DIR: ${{ runner.temp }}/offline-debs
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          RUN_BATTERIES: "true"
          FETCHED_SEAL: ${{ needs.fetch.outputs.seal_sha256 }}
          EXPECTED_CONTRACT_SHA256: ${{ needs.fetch.outputs.contract_sha256 }}
          GUEST_SCRIPT: scripts/gcp/lab-guests/enterprise-rows.sh
          DESCENDANT_SCRIPT: scripts/aws/lab-guests/descendant_b1.py
          PHASE2_HOST: scripts/aws/lab-guests/phase2_host.py
          PHASE2_GRADE: scripts/aws/lab-guests/phase2_grade.py
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
        run: |
          set -euo pipefail
          export GCP_LAB_GATE_JSON="$(cat "$GCP_LAB_GATE_JSON")"
          vantio run python3 scripts/gcp/offline_deliver.py run-batteries

      - name: Compile the T5 loader
        if: inputs.t5_egress
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang gcc libbpf-dev
          clang -O2 -g -target bpf -D__TARGET_ARCH_x86 \
            -c packages/t5-egress-kernel/bpf/t5_egress.bpf.c \
            -o "${{ runner.temp }}/t5_egress.bpf.o"
          gcc -O2 -Wall -Wextra -Werror \
            -o "${{ runner.temp }}/t5_load" \
            scripts/clean-host/t5/t5_load.c -lbpf -lelf -lz
          "${{ runner.temp }}/t5_load" path-check /sys/fs/cgroup/vantio-t5-lab.slice/t5-drill
          "${{ runner.temp }}/t5_load" path-check /sys/fs/cgroup/vantio-enrolled.slice && exit 1 || true

      - name: Run t5-egress on the fresh VM
        if: inputs.t5_egress
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_GATE_JSON: ${{ runner.temp }}/gcp-lab-evidence/cost-gate.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          EXPECTED_SEAL: ${{ inputs.seal }}
          T5_EGRESS: "true"
          RUN_BATTERIES: "false"
          SELF_SERVICE: "false"
          FETCHED_SEAL: ${{ needs.fetch.outputs.seal_sha256 }}
          EXPECTED_CONTRACT_SHA256: ${{ needs.fetch.outputs.contract_sha256 }}
          T5_OBJECT: ${{ runner.temp }}/t5_egress.bpf.o
          T5_LOADER: ${{ runner.temp }}/t5_load
          T5_GUEST_SCRIPT: scripts/aws/lab-guests/t5-egress.sh
        run: |
          set -euo pipefail
          export GCP_LAB_GATE_JSON="$(cat "$GCP_LAB_GATE_JSON")"
          vantio run python3 scripts/gcp/offline_deliver.py run-t5-egress

      - name: Capture the serial console
        if: always() && steps.auth.outcome == 'success'
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
        run: vantio run python3 scripts/gcp/offline_deliver.py serial-console

      - name: Delete the handoff prefix
        if: always() && steps.auth.outcome == 'success'
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          REDTEAM_BRAIN: ${{ inputs.redteam_brain == true && 'true' || 'false' }}
        run: vantio run python3 scripts/gcp/offline_deliver.py delete-handoff

      - name: Remove the OS Login key
        if: always() && steps.auth.outcome == 'success'
        run: vantio run python3 scripts/gcp/offline_deliver.py remove-oslogin-key

      - name: Delete the local bundle
        if: always()
        run: rm -rf "${{ runner.temp }}/enterprise-bundle"

      - name: Keep only allowlisted evidence
        id: prune
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: vantio run python3 scripts/gcp/offline_deliver.py prune-evidence

      - name: Upload row evidence
        if: always() && steps.prune.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-rows-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-evidence/
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-provision-deliver
          path: optics-observe-log
          if-no-files-found: warn

  teardown:
    name: Teardown and verify removal
    needs: [fetch, deliver]
    if: always()
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: gcp-lab
    timeout-minutes: 25
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/gcp-lab-provision.yml@refs/heads/main"

      - name: Refuse static GCP keys
        env:
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
          GCP_LAB_SERVICE_ACCOUNT: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi
          test -n "$GCP_LAB_PROJECT"
          test -n "$GCP_LAB_WIF_PROVIDER"
          test -n "$GCP_LAB_SERVICE_ACCOUNT"
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"
          test "$GCP_LAB_SERVICE_ACCOUNT" = "vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com"

      - name: Checkout teardown script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/gcp/offline_deliver.py
            scripts/gcp/offline_deliver_1.py
            scripts/gcp/offline_deliver_2.py
            scripts/gcp/offline_deliver_3.py
            scripts/gcp/redteam_brain.py
            scripts/gcp/redteam_campaign.py
            scripts/gcp/redteam_packet.py
            scripts/gcp/lab_auto.py
            scripts/gcp/lab_capabilities.json
          sparse-checkout-cone-mode: false

      - name: Authenticate as vantio-lab-gha
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Delete the VM and verify it is gone
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          REDTEAM_BRAIN: ${{ inputs.redteam_brain == true && 'true' || 'false' }}
        run: vantio run python3 scripts/gcp/offline_deliver.py teardown-if-present

      - name: Keep only allowlisted evidence
        id: prune
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: vantio run python3 scripts/gcp/offline_deliver.py prune-evidence

      - name: Upload teardown evidence
        if: always() && steps.prune.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-teardown-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-evidence/
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-provision-teardown
          path: optics-observe-log
          if-no-files-found: warn
