name: T0 OpenClaw hygiene

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hygiene:
    name: Pin, hash, and allow-list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test the checker
        run: python3 tests/gap/test_t0_openclaw_hygiene.py -v

      - name: Re-run the proof against the committed evidence
        run: python3 scripts/gap/t0_proof.py --check
