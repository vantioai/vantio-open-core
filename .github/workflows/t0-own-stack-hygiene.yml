name: T0 OpenClaw hygiene

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hygiene:
    name: Pin, hash, and allow-list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test the checker
        run: python3 tests/gap/test_t0_openclaw_hygiene.py -v

      - name: Re-run the proof against the committed evidence
        run: python3 scripts/gap/t0_proof.py --check

      - name: Optics observe (Lab-only)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          npm install -g @vantio/cli
          pip install vantio-agent-sdk
          vantio run node -e 'process.exit(0)'
          vantio run python -c 'raise SystemExit(0)'
          mkdir -p optics-observe-log
          if [ -d "$HOME/.vantio/runs" ]; then
            cp -a "$HOME/.vantio/runs/." optics-observe-log/
          fi
          exit 0

      - name: Upload Optics observation log (Lab-only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-hygiene
          path: optics-observe-log
          if-no-files-found: warn
