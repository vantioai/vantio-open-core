name: Vantio Prove (example)

# Example consumer of the composite action. Enable on your app repos by
# copying .github/actions/vantio-prove or depending on this org action pattern.
on:
  workflow_dispatch: {}

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate proof
        uses: ./.github/actions/vantio-prove
        with:
          format: md
          output-path: artifacts/vantio-proof.md
