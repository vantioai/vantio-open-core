name: W3 lab auto teardown

# Terminate one owned lab and delete the volume, security group, and key that
# share its Name tag. An instance without the owned lab tags is left in place.
# Trust subject:
#   repo:vantioai/vantio-open-core:environment:w3-lab-auto
# Role: arn:aws:iam::960577828987:role/vantio-w3-lab-sweeper
# This does not set NONINTERACTIVE_TEARDOWN_READY.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Owned lab instance id.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: w3-lab-free-ec2
  cancel-in-progress: false

jobs:
  teardown:
    name: Tear down one owned lab
    runs-on: ubuntu-latest
    environment: w3-lab-auto
    timeout-minutes: 30
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/w3-lab-auto-teardown.yml@refs/heads/main"

      - name: Refuse static AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "static AWS credentials are present" >&2
            exit 1
          fi

      - name: Checkout teardown script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_auto.py
            scripts/aws/w3_lab_steps.py
          sparse-checkout-cone-mode: false

      - name: Assume vantio-w3-lab-sweeper
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::960577828987:role/vantio-w3-lab-sweeper
          role-session-name: w3-lab-auto-teardown-${{ github.run_id }}
          aws-region: us-east-2
          role-duration-seconds: "900"
          audience: sts.amazonaws.com
          allowed-account-ids: "960577828987"
          use-existing-credentials: false
          output-credentials: false

      - name: Tear down the owned instance
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          EVIDENCE_PATH: w3-lab-teardown.json
        run: python3 scripts/aws/w3_lab_steps.py teardown

      - name: Upload teardown evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-teardown-${{ github.run_id }}
          path: |
            w3-lab-teardown.json
            w3-lab-teardown.json.sha256
          if-no-files-found: error
