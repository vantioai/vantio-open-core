name: W3 lab auto arm

# Arm one owned lab instance from a GitHub-hosted runner.
# Trust subject, when this file is on main:
#   repo:vantioai/vantio-open-core:environment:w3-lab-auto
#   :job_workflow_ref:vantioai/vantio-open-core/.github/workflows/w3-lab-auto-arm.yml@refs/heads/main
# Role: arn:aws:iam::960577828987:role/vantio-w3-lab-provision
# This file stays the arm workflow so that subject does not change.
#
# enterprise_rows defaults to false. The marker path is unchanged.
# When it is true, the job downloads a private release from
# vantio-enterprise-private with the environment secret
# W3_LAB_PRIVATE_BUNDLE_TOKEN (contents:read on that repo only), checks the
# seal and the non-production trust file, then copies them over Instance
# Connect. The token is not an AWS credential and is not written to evidence.
# A missing secret fails closed before AssumeRole. The row JSON uploaded
# from this public repo is the guest result only, after redaction.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Owned lab instance id.
        required: true
        type: string
      seal:
        description: Seal sha256, 64 hex characters. Empty uses release/pe-canonical-seal.json lane_seal.sha256. The downloaded manifest must carry this digest.
        required: false
        default: ""
        type: string
      bundle_commit:
        description: Private lab bundle commit, 40 hex characters. Empty uses the commit already pinned in the bundle checker.
        required: false
        default: ""
        type: string
      public_pin:
        description: Public installer pin, 64 hex characters. Empty uses release/pe-canonical-seal.json public_pin.archive_sha256.
        required: false
        default: ""
        type: string
      enterprise_rows:
        description: Run the Enterprise row proof on this owned host. Default is the marker only.
        required: false
        default: false
        type: boolean
      bundle_tag:
        description: Unused. The bundle is read from a pinned private commit, not a tag.
        required: false
        default: lab-bundle/enterprise-pe-2026-10-08
        type: string
      battery:
        description: enterprise keeps the grant and revoke rows. reboot-check schedules the LSM reboot and confirms the boot id changed. descendant-b1 runs the moved-child deny and repeats it after that same reboot. self-service runs the public one-command installer. self-service-enforce runs observe, host-prep, a workflow reboot, and enforce. webshell runs the sealed web-shell battery with enterprise rows and the red-team brain left off. Phase names run one clean-host battery on the working seal. Teardown and verify-removed stay the existing dispatch workflows.
        required: false
        default: enterprise
        type: choice
        options:
          - enterprise
          - reboot-check
          - descendant-b1
          - self-service
          - self-service-enforce
          - webshell
          - r15-container-exit
          - 2c-upgrade-rollback
          - 2d-crash-recovery
          - 2e-performance
          - 2f-tamper
          - 2g-distro
          - lsm-guard
          - soak-hourly
      redteam_brain:
        description: Download the pinned Qwen on the runner and copy it over SSH. Requires m7i-flex.large. Default off.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantio-lab-slot
  cancel-in-progress: false

jobs:
  arm:
    name: Arm one owned lab
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: w3-lab-auto
    timeout-minutes: 60
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "vantioai/vantio-open-core/.github/workflows/w3-lab-auto-arm.yml@refs/heads/main"
          if [ "${{ inputs.battery }}" = "self-service" ] || [ "${{ inputs.battery }}" = "self-service-enforce" ]; then
            if [ "${{ inputs.enterprise_rows }}" = "true" ]; then
              echo "self-service does not run the enterprise rows" >&2
              exit 1
            fi
            if [ "${{ inputs.redteam_brain }}" = "true" ]; then
              echo "self-service does not run the red-team brain" >&2
              exit 1
            fi
          fi
          if [ "${{ inputs.battery }}" = "webshell" ] && [ "${{ inputs.enterprise_rows }}" = "true" ]; then
            echo "webshell does not run the enterprise rows" >&2
            exit 1
          fi
          if [ "${{ inputs.battery }}" = "webshell" ] && [ "${{ inputs.redteam_brain }}" = "true" ]; then
            echo "webshell does not run the red-team brain" >&2
            exit 1
          fi

      - name: Refuse static AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "static AWS credentials are present" >&2
            exit 1
          fi

      - name: Checkout arm script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_auto.py
            scripts/aws/w3_lab_steps.py
            scripts/aws/enterprise_bundle.py
            scripts/aws/lab_iam_capabilities.json
            scripts/aws/lab-guests/marker.sh
            scripts/aws/lab-guests/enterprise-rows.sh
            scripts/aws/lab-guests/descendant_b1.py
            scripts/aws/lab-guests/descendant_probe.c
            scripts/aws/lab-guests/descendant_probe
            scripts/aws/lab-guests/phase2_host.py
            scripts/aws/lab-guests/phase2_grade.py
            scripts/aws/lab-guests/baseline_diag.py
            scripts/aws/lab-guests/sticky_write.py
            scripts/aws/lab-guests/product_uninstall_census.py
            scripts/aws/lab-guests/t5-egress.sh
            scripts/clean-host/t5/
            packages/t5-egress-drills/
            packages/t5-egress-kernel/
            scripts/aws/lab-guests/soak_check.py
            scripts/aws/lab-guests/soak-hourly.sh
            scripts/aws/lab-guests/record-check.sh
            scripts/aws/fetch_offline_debs.sh
            scripts/aws/lab-guests/self_service.py
            scripts/aws/lab-guests/self_service_enforce.py
            scripts/aws/lab-guests/webshell_guest.py
            scripts/aws/lab-guests/webshell_grade.py
            scripts/release/pe_canonical_seal.py
            release/pe-canonical-seal.json
            release/pe-seal-history.json
            scripts/lab/stage_lab_trust.py
            packages/vantio-install/vantio_install/
            packages/vantio-install/requirements/dev-hashes.txt
            scripts/gcp/fetch_offline_debs.sh
            scripts/gcp/lab-guests/redteam_rows.py
            scripts/gcp/redteam_packet.py
            scripts/gcp/redteam_brain.py
            scripts/aws/stage_redteam_brain.py
          sparse-checkout-cone-mode: false

      - name: Read the canonical seal
        id: canonical
        env:
          INPUT_SEAL: ${{ inputs.seal }}
          INPUT_PUBLIC_PIN: ${{ inputs.public_pin }}
        run: |
          set -euo pipefail
          test -f release/pe-canonical-seal.json
          lane=$(jq -r '.lane_seal.sha256' release/pe-canonical-seal.json)
          pin=$(jq -r '.public_pin.archive_sha256' release/pe-canonical-seal.json)
          printf '%s\n' "$lane" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$pin" | grep -Eq '^[0-9a-f]{64}$'
          seal="${INPUT_SEAL:-}"
          public="${INPUT_PUBLIC_PIN:-}"
          if [ -z "$seal" ]; then
            seal="$lane"
          fi
          if [ -z "$public" ]; then
            public="$pin"
          fi
          printf '%s\n' "$seal" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$public" | grep -Eq '^[0-9a-f]{64}$'
          echo "seal=$seal" >> "$GITHUB_OUTPUT"
          echo "public_pin=$public" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Read the SSH switch
        id: cap
        env:
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py preflight-arm

      - name: Prepare the private bundle
        id: bundle
        if: inputs.enterprise_rows || inputs.battery == 'webshell'
        env:
          W3_LAB_PRIVATE_BUNDLE_TOKEN: ${{ secrets.W3_LAB_PRIVATE_BUNDLE_TOKEN }}
          W3_BUNDLE_TAG: ${{ inputs.bundle_tag }}
          W3_BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          W3_EXPECTED_SEAL: ${{ steps.canonical.outputs.seal }}
          W3_BATTERY: ${{ inputs.battery }}
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          EVIDENCE_PATH: w3-lab-bundle.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py prepare-bundle

      - name: Fetch offline packages
        if: (inputs.enterprise_rows && steps.bundle.outputs.ready == 'true') || inputs.battery == 'self-service' || inputs.battery == 'self-service-enforce' || inputs.battery == '2g-distro'
        run: |
          set -euo pipefail
          if [ "${{ inputs.battery }}" = "2g-distro" ]; then
            vantio run bash scripts/gcp/fetch_offline_debs.sh "${{ runner.temp }}/offline-debs"
          else
            vantio run bash scripts/aws/fetch_offline_debs.sh "${{ runner.temp }}/offline-debs"
          fi

      - name: Stage the lab installer and a non-production trust key
        if: inputs.battery == 'self-service'
        env:
          PYTHONPATH: packages/vantio-install
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --disable-pip-version-check -r packages/vantio-install/requirements/dev-hashes.txt
          dest="${{ runner.temp }}/self-service"
          pinned="${{ runner.temp }}/pinned-artifacts"
          mkdir -p "$dest" "$pinned"
          cp scripts/aws/lab-guests/self_service.py "$dest/self_service.py"
          cp -a packages/vantio-install/vantio_install "$dest/vantio_install"
          vantio run python3 scripts/lab/stage_lab_trust.py fetch "$pinned"
          vantio run python3 scripts/lab/stage_lab_trust.py stage "$dest" "$pinned"
          test -f "$dest/self-service.tar"
          test -f "$dest/lab-artifact-trust.json"
          vantio run python3 -c 'import json,pathlib,sys; p=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert p.get("audience")=="LAB_NONPROD" and p.get("not_a_production_root") is True' "$dest/lab-artifact-trust.json"

      - name: Stage the enforce installer and a workflow-minted test license
        if: inputs.battery == 'self-service-enforce'
        env:
          PYTHONPATH: packages/vantio-install
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --disable-pip-version-check -r packages/vantio-install/requirements/dev-hashes.txt
          dest="${{ runner.temp }}/self-service"
          pinned="${{ runner.temp }}/pinned-artifacts"
          mkdir -p "$dest" "$pinned"
          cp scripts/aws/lab-guests/self_service_enforce.py "$dest/self_service_enforce.py"
          cp -a packages/vantio-install/vantio_install "$dest/vantio_install"
          summary="$(PYTHONPATH=packages/vantio-install python3 scripts/aws/lab-guests/self_service_enforce.py mint "$dest")"
          python3 -c 'import json,sys; body=json.loads(sys.argv[1]); text=json.dumps(body); assert "vl1." not in text and "PRIVATE" not in text' "$summary"
          vantio run python3 scripts/lab/stage_lab_trust.py fetch "$pinned"
          vantio run python3 scripts/lab/stage_lab_trust.py stage "$dest" "$pinned"
          test -f "$dest/self-service.tar"
          test -f "$dest/license.token"
          test -f "$dest/lab-license-public.json"
          python3 -c 'import pathlib,re,sys; root=pathlib.Path(sys.argv[1]); pat=re.compile(br"-----BEGIN [A-Z ]*PRIVATE KEY-----"); bad=[str(p) for p in root.rglob("*") if p.is_file() and p.suffix not in {".tar",".whl",".tgz"} and pat.search(p.read_bytes())]; assert not bad' "$dest"

      - name: Fetch the pinned local brain
        if: inputs.redteam_brain && inputs.enterprise_rows && steps.bundle.outputs.ready == 'true'
        run: vantio run python3 scripts/aws/stage_redteam_brain.py "${{ runner.temp }}/redteam-brain"

      - name: Assume vantio-w3-lab-provision
        id: assume
        if: success() && steps.cap.outputs.proceed == 'true' && (inputs.enterprise_rows == false || steps.bundle.outputs.ready == 'true')
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::960577828987:role/vantio-w3-lab-provision
          role-session-name: w3-lab-auto-arm-${{ github.run_id }}
          aws-region: us-east-2
          role-duration-seconds: "3600"
          audience: sts.amazonaws.com
          allowed-account-ids: "960577828987"
          use-existing-credentials: false
          output-credentials: false

      - name: Read the runner address
        id: runner
        if: success() && steps.cap.outputs.proceed == 'true' && (inputs.enterprise_rows == false || steps.bundle.outputs.ready == 'true')
        run: |
          set -euo pipefail
          ip=$(vantio run curl -4 -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"

      - name: Arm the guest marker
        if: success() && steps.cap.outputs.proceed == 'true' && inputs.enterprise_rows == false && inputs.battery != 'self-service' && inputs.battery != 'self-service-enforce' && inputs.battery != 'webshell'
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          SEAL: ${{ steps.canonical.outputs.seal }}
          PUBLIC_PIN: ${{ steps.canonical.outputs.public_pin }}
          W3_RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py arm

      - name: Run the self-service installer
        if: success() && steps.cap.outputs.proceed == 'true' && inputs.battery == 'self-service'
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          SEAL: ${{ steps.canonical.outputs.seal }}
          PUBLIC_PIN: ${{ steps.canonical.outputs.public_pin }}
          W3_RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
          W3_SELF_SERVICE_DIR: ${{ runner.temp }}/self-service
          W3_ROWS_PATH: w3-lab-enterprise-rows.json
          W3_OFFLINE_DEBS: ${{ runner.temp }}/offline-debs
          W3_BATTERY: self-service
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py arm-self-service

      - name: Run the self-service enforce installer
        if: success() && steps.cap.outputs.proceed == 'true' && inputs.battery == 'self-service-enforce'
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          SEAL: ${{ steps.canonical.outputs.seal }}
          PUBLIC_PIN: ${{ steps.canonical.outputs.public_pin }}
          W3_RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
          W3_SELF_SERVICE_DIR: ${{ runner.temp }}/self-service
          W3_ROWS_PATH: w3-lab-enterprise-rows.json
          W3_OFFLINE_DEBS: ${{ runner.temp }}/offline-debs
          W3_BATTERY: self-service-enforce
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py arm-self-service-enforce

      - name: Run the webshell battery
        if: success() && steps.cap.outputs.proceed == 'true' && inputs.battery == 'webshell' && steps.bundle.outputs.ready == 'true'
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          SEAL: ${{ steps.canonical.outputs.seal }}
          PUBLIC_PIN: ${{ steps.canonical.outputs.public_pin }}
          W3_RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          W3_ROWS_PATH: w3-lab-enterprise-rows.json
          W3_BATTERY: webshell
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py arm-webshell

      - name: Run the Enterprise rows
        if: success() && steps.cap.outputs.proceed == 'true' && inputs.enterprise_rows == true
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          SEAL: ${{ steps.canonical.outputs.seal }}
          PUBLIC_PIN: ${{ steps.canonical.outputs.public_pin }}
          W3_RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
          W3_BUNDLE_DIR: ${{ runner.temp }}/enterprise-bundle
          W3_ROWS_PATH: w3-lab-enterprise-rows.json
          W3_REDTEAM_PATH: w3-lab-redteam-rows.json
          W3_OFFLINE_DEBS: ${{ runner.temp }}/offline-debs
          W3_BRAIN_DIR: ${{ inputs.redteam_brain && format('{0}/redteam-brain', runner.temp) || '' }}
          W3_BATTERY: ${{ inputs.battery }}
          EVIDENCE_PATH: w3-lab-arm.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py arm-enterprise

      - name: Close the runner SSH rule
        if: always() && steps.assume.outcome == 'success'
        env:
          W3_STAMP: ${{ runner.temp }}/ssh-stamp.json
        run: vantio run python3 scripts/aws/w3_lab_steps.py close-ssh

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-arm-${{ github.run_id }}
          path: |
            w3-lab-arm.json
            w3-lab-arm.json.sha256
          if-no-files-found: error

      - name: Stage enterprise row evidence
        if: always() && (inputs.enterprise_rows || inputs.battery == 'self-service' || inputs.battery == 'self-service-enforce' || inputs.battery == 'webshell')
        run: |
          set -euo pipefail
          mkdir -p row-evidence
          for name in w3-lab-bundle.json w3-lab-bundle.json.sha256 w3-lab-enterprise-rows.json w3-lab-enterprise-rows.json.sha256 w3-lab-redteam-rows.json w3-lab-redteam-rows.json.sha256 w3-lab-h-u.json w3-lab-h-u.json.sha256; do
            if [ -f "$name" ]; then
              cp "$name" row-evidence/
            fi
          done
          shopt -s nullglob
          for console in w3-lab-console-*.txt; do
            cp "$console" row-evidence/
          done

      - name: Upload enterprise row evidence
        if: always() && (inputs.enterprise_rows || inputs.battery == 'self-service' || inputs.battery == 'self-service-enforce' || inputs.battery == 'webshell')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-enterprise-rows-${{ github.run_id }}
          path: row-evidence/
          if-no-files-found: warn

      - name: Upload the reboot serial log
        if: always() && inputs.battery == 'reboot-check'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-console-${{ github.run_id }}
          path: w3-lab-console-*.txt
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-w3-lab-auto-arm-arm
          path: optics-observe-log
          if-no-files-found: warn
