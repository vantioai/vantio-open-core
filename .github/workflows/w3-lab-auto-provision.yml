name: W3 lab auto provision

# Lab provision. Dispatch only from main. The cost gate must pass first.
# Trust subject:
#   repo:vantioai/vantio-open-core:environment:w3-lab-auto
# job_workflow_ref:
#   vantioai/vantio-open-core/.github/workflows/w3-lab-auto-provision.yml@refs/heads/main
# Role: arn:aws:iam::960577828987:role/vantio-w3-lab-provision
# Requested session: 3600 seconds. Role maximum: 3600 seconds.
#
# The cost gate runs first, in its own workflow file, under the billing-read
# role. Launch runs only when that gate outputs expected_oop_usd=0.
# Launch aborts before RunInstances when any instance in us-east-2 is pending,
# running, stopping, stopped, or shutting down. That is the one-EC2 slot.
# scripts/aws/w3_lab_auto.py launch calls RunInstances only after the cost
# gate file says expected_oop_usd is 0. NONINTERACTIVE_TEARDOWN_READY stays false.
# close_egress defaults to false. Phantom Engine batteries launch with the
# default allow-all egress earlier hosts used. The red-team campaign sets
# close_egress true. That path still revokes allow-all egress and aborts,
# deleting the group, if the revoke is denied or the allow-all rule remains.
# ReleaseAddress is not called. Do not add ec2:RevokeSecurityGroupEgress.
# m7i-flex.large is the credit-funded brain shape. stop_after_minutes above
# 120 is refused for that type. The cost gate still returns expected_oop_usd
# 0 only when Free-plan credits cover the $2 ceiling. Cost Explorer is not called.

on:
  workflow_dispatch:
    inputs:
      instance_type:
        description: Free-plan amd64 type. t3.micro, t3.small, or m7i-flex.large. The flex shape is capped at 120 minutes.
        required: true
        default: t3.micro
        type: choice
        options:
          - t3.micro
          - t3.small
          - m7i-flex.large
      stop_after_minutes:
        description: Self-stop delay in minutes. 1 through 420. m7i-flex.large refuses a value above 120.
        required: true
        default: "420"
        type: string
      associate_public_ipv4:
        description: Assign a public IPv4. Leave false unless the lab must be reached without an instance profile.
        required: true
        default: false
        type: boolean
      purpose:
        description: Empty, or c8-noninteractive-teardown for a C8 fixture.
        required: false
        default: ""
        type: string
      expires_in_minutes:
        description: Minutes until vantio:expires-at. Empty uses stop_after_minutes. 1 through 420.
        required: false
        default: ""
        type: string
      image_id:
        description: Ubuntu pin ami-0fa99aa8f97f9e30b, or the official Debian 12 amd64 id from the sitting summary.
        required: false
        default: ami-0fa99aa8f97f9e30b
        type: string
      describe_only:
        description: Describe the AMI and exit. Does not call RunInstances.
        required: false
        default: false
        type: boolean
      close_egress:
        description: Revoke the new group's allow-all egress before launch. Red-team sets this true. Phantom Engine batteries leave it false.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantio-lab-slot
  cancel-in-progress: false

jobs:
  gate:
    name: Pre-run cost check
    uses: vantioai/vantio-open-core/.github/workflows/w3-lab-auto-cost-gate.yml@main # oidc-trust
    permissions:
      contents: read
      id-token: write

  launch:
    name: Launch one lab in us-east-2
    needs: gate
    if: needs.gate.outputs.expected_oop_usd == '0'
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: w3-lab-auto
    timeout-minutes: 30
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Refuse static AWS keys
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "static AWS credentials are present" >&2
            exit 1
          fi

      - name: Checkout launch script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/aws/w3_lab_auto.py
          sparse-checkout-cone-mode: false

      - name: Assume vantio-w3-lab-provision
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::960577828987:role/vantio-w3-lab-provision
          role-session-name: w3-lab-auto-provision-${{ github.run_id }}
          aws-region: us-east-2
          role-duration-seconds: "3600"
          audience: sts.amazonaws.com
          allowed-account-ids: "960577828987"
          use-existing-credentials: false
          output-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Launch one tagged lab instance
        env:
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
          EXPIRES_IN_MINUTES: ${{ inputs.expires_in_minutes }}
          ASSOCIATE_PUBLIC_IPV4: ${{ inputs.associate_public_ipv4 }}
          PURPOSE: ${{ inputs.purpose }}
          IMAGE_ID: ${{ inputs.image_id }}
          DESCRIBE_ONLY: ${{ inputs.describe_only }}
          CLOSE_EGRESS: ${{ inputs.close_egress }}
          COST_GATE_JSON: ${{ needs.gate.outputs.gate_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COST_GATE_JSON" > "$RUNNER_TEMP/cost-gate.json"
          COST_GATE_FILE="$RUNNER_TEMP/cost-gate.json" vantio run python3 scripts/aws/w3_lab_auto.py launch

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w3-lab-auto-launch-${{ github.run_id }}
          path: |
            w3-lab-auto-launch.json
            w3-lab-auto-launch.json.sha256
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-w3-lab-auto-provision-launch
          path: optics-observe-log
          if-no-files-found: warn
