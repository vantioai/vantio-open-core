name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      - name: Publish @vantio/agent-sdk
        working-directory: packages/vantio-agent-sdk
        run: pnpm publish --access public --no-git-checks || echo "Version already published — skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vantio/cli
        working-directory: packages/vantio-cli
        run: pnpm publish --access public --no-git-checks || echo "Version already published — skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
