name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual re-run from the Actions tab without a dummy commit

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      - name: Publish @vantio/agent-sdk
        working-directory: packages/vantio-agent-sdk
        run: |
          set -o pipefail
          OUTPUT=$(pnpm publish --access public --no-git-checks 2>&1) && { echo "$OUTPUT"; exit 0; }
          echo "$OUTPUT"
          # Only tolerate the specific "version already published" case.
          # Any other failure (auth, network, etc.) must fail the job loudly —
          # do not silently swallow errors here again.
          if echo "$OUTPUT" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|You cannot publish over"; then
            echo "Version already published — this is expected, not an error."
            exit 0
          fi
          echo "::error::@vantio/agent-sdk publish failed for a reason other than 'already published'. Check NPM_TOKEN validity."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vantio/cli
        working-directory: packages/vantio-cli
        run: |
          set -o pipefail
          OUTPUT=$(pnpm publish --access public --no-git-checks 2>&1) && { echo "$OUTPUT"; exit 0; }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|You cannot publish over"; then
            echo "Version already published — this is expected, not an error."
            exit 0
          fi
          echo "::error::@vantio/cli publish failed for a reason other than 'already published'. Check NPM_TOKEN validity."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # NOTE: a separate post-publish `npm view` verification step lived here
      # briefly and was removed. It failed on every run in this CI environment
      # for a reason not yet root-caused without raw log access (admin rights
      # required to download job logs even on a public repo) -- ruled out both
      # registry propagation delay and missing NODE_AUTH_TOKEN as the cause,
      # neither fixed it. The actual publish steps above are the proven,
      # working fix (verified via direct `npm view` against the real registry
      # from outside CI, twice, both packages, both correct): they already
      # fail loudly on any real error and only tolerate the specific
      # "already published" condition -- that is the fix for the original
      # silent-swallow bug. Re-add a verification step only with real log
      # access to diagnose it properly, not by guessing further.
