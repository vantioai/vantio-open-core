name: Publish to npm

# Triggers on every push to main so packages auto-publish when merged.
# Packages only actually publish when the version in package.json changes
# (npm publish is a no-op if the version already exists in the registry).
on:
  push:
    branches: [main]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build @vantio/agent-sdk ────────────────────────────────────────────
      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      # ── Publish @vantio/agent-sdk ──────────────────────────────────────────
      # --no-git-checks skips the dirty-tree check (CI checkout is clean).
      # We use || true so the step doesn't fail if the version already exists.
      - name: Publish @vantio/agent-sdk
        run: |
          cd packages/vantio-agent-sdk
          npm publish --access public --no-git-checks 2>&1 | tee /tmp/publish-sdk.log
          grep -q "already exists" /tmp/publish-sdk.log && echo "Version already published — skipping." || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish @vantio/cli ────────────────────────────────────────────────
      # No build step needed — ships pre-authored JS (bin/vantio.js).
      - name: Publish @vantio/cli
        run: |
          cd packages/vantio-cli
          npm publish --access public --no-git-checks 2>&1 | tee /tmp/publish-cli.log
          grep -q "already exists" /tmp/publish-cli.log && echo "Version already published — skipping." || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
