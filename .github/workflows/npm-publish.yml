name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual re-run from the Actions tab without a dummy commit

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @vantio/agent-sdk
        run: pnpm --filter @vantio/agent-sdk run build

      - name: Publish @vantio/agent-sdk
        working-directory: packages/vantio-agent-sdk
        run: |
          set -o pipefail
          OUTPUT=$(pnpm publish --access public --no-git-checks 2>&1) && { echo "$OUTPUT"; exit 0; }
          echo "$OUTPUT"
          # Only tolerate the specific "version already published" case.
          # Any other failure (auth, network, etc.) must fail the job loudly —
          # do not silently swallow errors here again.
          if echo "$OUTPUT" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|You cannot publish over"; then
            echo "Version already published — this is expected, not an error."
            exit 0
          fi
          echo "::error::@vantio/agent-sdk publish failed for a reason other than 'already published'. Check NPM_TOKEN validity."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @vantio/cli
        working-directory: packages/vantio-cli
        run: |
          set -o pipefail
          OUTPUT=$(pnpm publish --access public --no-git-checks 2>&1) && { echo "$OUTPUT"; exit 0; }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|You cannot publish over"; then
            echo "Version already published — this is expected, not an error."
            exit 0
          fi
          echo "::error::@vantio/cli publish failed for a reason other than 'already published'. Check NPM_TOKEN validity."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published versions match package.json
        run: |
          # npm's registry has a brief propagation delay after a publish
          # completes -- a read immediately afterward can still return the
          # previous version. Retry with backoff before treating a mismatch
          # as a real failure.
          for pkg in vantio-agent-sdk vantio-cli; do
            LOCAL=$(node -p "require('./packages/$pkg/package.json').version")
            PUBLISHED="NOT_FOUND"
            for attempt in 1 2 3 4 5; do
              PUBLISHED=$(npm view "@vantio/$pkg" version 2>&1 || echo "NOT_FOUND")
              if [ "$LOCAL" = "$PUBLISHED" ]; then
                break
              fi
              echo "$pkg: attempt $attempt — local=$LOCAL published=$PUBLISHED (not yet propagated, retrying in 5s)"
              sleep 5
            done
            echo "$pkg: final local=$LOCAL published=$PUBLISHED"
            if [ "$LOCAL" != "$PUBLISHED" ]; then
              echo "::error::@vantio/$pkg version mismatch after 5 retries — local package.json says $LOCAL but npm registry still shows $PUBLISHED. The publish step above did not actually take effect."
              exit 1
            fi
          done
        env:
          # actions/setup-node's registry-url writes an .npmrc that expects
          # this for ANY npm command in the job, not just publish -- without
          # it, `npm view` itself can fail outright (not just return stale
          # data), which is what actually happened here: the "propagation
          # delay" theory was wrong, this was an auth context bug in this
          # step, not a registry timing issue.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
