name: Publish to npm

# Manual release gate for one allowlisted npm package.
# Ordinary pushes and pull-request merges do not run this workflow.
# This job does not pack, rebuild, or call npm publish. The enrolled runtime
# promotes the sealed tarball only after this gate succeeds.
# A green gate is not an SLSA verification.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to gate
        required: true
        type: choice
        options:
          - "@vantio/cli"
          - "@vantio/agent-sdk"
          - "@vantio/optics-mcp"
          - "@vantio/gate-mcp"
      version:
        description: Exact version
        required: true
        type: string
      source_commit:
        description: Full source commit SHA
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the sealed tarball
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release coordinates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gate sealed request
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          node scripts/release/promote_npm.mjs --gate \
            --package "$INPUT_PACKAGE" \
            --version "$INPUT_VERSION" \
            --source-commit "$INPUT_COMMIT" \
            --checkout-sha "$CHECKOUT_SHA" \
            --expected-sha256 "$INPUT_SHA256" \
            --repo-root "$GITHUB_WORKSPACE"

  record-approval:
    name: Record founder approval
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-check coordinates after approval
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          node scripts/release/promote_npm.mjs --gate \
            --package "$INPUT_PACKAGE" \
            --version "$INPUT_VERSION" \
            --source-commit "$INPUT_COMMIT" \
            --checkout-sha "$CHECKOUT_SHA" \
            --expected-sha256 "$INPUT_SHA256" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Write approval record
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ENVIRONMENT: npm-publish
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("release-approval.json").write_text(json.dumps({
              "approved": True,
              "package": os.environ["INPUT_PACKAGE"],
              "version": os.environ["INPUT_VERSION"],
              "source_commit": os.environ["INPUT_COMMIT"],
              "artifact_sha256": os.environ["INPUT_SHA256"],
              "environment": os.environ["RELEASE_ENVIRONMENT"],
              "actor": os.environ["RELEASE_ACTOR"],
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload approval record
        uses: actions/upload-artifact@v4
        with:
          name: release-approval
          path: release-approval.json
          if-no-files-found: error

      - name: Write release summary
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          {
            echo "source_commit=$INPUT_COMMIT"
            echo "package=$INPUT_PACKAGE"
            echo "version=$INPUT_VERSION"
            echo "artifact_sha256=$INPUT_SHA256"
            echo "environment=npm-publish"
            echo "actor=$RELEASE_ACTOR"
            echo "registry_write=not_performed_by_this_workflow"
          } >> "$GITHUB_STEP_SUMMARY"
