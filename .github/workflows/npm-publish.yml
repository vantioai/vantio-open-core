name: Publish to npm

# Manual release gate for one allowlisted npm package.
# Ordinary pushes and pull-request merges do not run this workflow.
# This job does not pack, rebuild, or call npm publish. The enrolled runtime
# promotes the sealed tarball only after this gate succeeds.
# A green gate is not an SLSA verification.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to gate
        required: true
        type: choice
        options:
          - "@vantio/cli"
          - "@vantio/agent-sdk"
          - "@vantio/optics-mcp"
          - "@vantio/gate-mcp"
      version:
        description: Exact version
        required: true
        type: string
      source_commit:
        description: Full source commit SHA
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the sealed tarball
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release coordinates
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Gate sealed request
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          vantio run node scripts/release/promote_npm.mjs --gate \
            --package "$INPUT_PACKAGE" \
            --version "$INPUT_VERSION" \
            --source-commit "$INPUT_COMMIT" \
            --checkout-sha "$CHECKOUT_SHA" \
            --expected-sha256 "$INPUT_SHA256" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
            exit 1
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-validate
          path: optics-observe-log
          if-no-files-found: error

  record-approval:
    name: Record founder approval
    needs: validate
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: npm-publish
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Re-check coordinates after approval
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          vantio run node scripts/release/promote_npm.mjs --gate \
            --package "$INPUT_PACKAGE" \
            --version "$INPUT_VERSION" \
            --source-commit "$INPUT_COMMIT" \
            --checkout-sha "$CHECKOUT_SHA" \
            --expected-sha256 "$INPUT_SHA256" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Write approval record
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ENVIRONMENT: npm-publish
        run: |
          vantio run python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("release-approval.json").write_text(json.dumps({
              "approved": True,
              "package": os.environ["INPUT_PACKAGE"],
              "version": os.environ["INPUT_VERSION"],
              "source_commit": os.environ["INPUT_COMMIT"],
              "artifact_sha256": os.environ["INPUT_SHA256"],
              "environment": os.environ["RELEASE_ENVIRONMENT"],
              "actor": os.environ["RELEASE_ACTOR"],
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload approval record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-approval
          path: release-approval.json
          if-no-files-found: error

      - name: Write release summary
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          {
            echo "source_commit=$INPUT_COMMIT"
            echo "package=$INPUT_PACKAGE"
            echo "version=$INPUT_VERSION"
            echo "artifact_sha256=$INPUT_SHA256"
            echo "environment=npm-publish"
            echo "actor=$RELEASE_ACTOR"
            echo "registry_write=not_performed_by_this_workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
            exit 1
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-record-approval
          path: optics-observe-log
          if-no-files-found: error
