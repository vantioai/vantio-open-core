name: GCP lab cost gate

# Read-only gate for the Vantio GCP lab. Dispatch or call from main only.
# Workload identity, after the file is on main:
#   repo:vantioai/vantio-open-core:ref:refs/heads/main
#   job_workflow_ref:
#   vantioai/vantio-open-core/.github/workflows/gcp-lab-cost-gate.yml@refs/heads/main
# expected_oop_usd is 0 only when this lab project's own labels and billing
# link can cover a $1 ceiling. The job does not list another project's IAM
# and does not bind a billing-account role. A green gate does not start a VM
# and does not install Phantom Engine.
#
# A caller may set proof_slice to full, reboot-pre, or reboot-post. Those
# values run the enforcement-proof guest jobs in this file. Their OIDC
# job_workflow_ref is this file at refs/heads/main. An empty proof_slice
# runs the gate only. The guest jobs are skipped.

env:
  # Deployment-partner name substrings, comma-separated. Set as a repo variable, never in code.
  VANTIO_PARTNER_MARKERS: ${{ vars.VANTIO_PARTNER_MARKERS }}
  GCP_LAB_PROJECT: vantio-lab-oct08
  GCP_LAB_WIF_PROVIDER: projects/910881070503/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_LAB_SERVICE_ACCOUNT: vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com

on:
  workflow_call:
    inputs:
      proof_slice:
        description: Empty runs the cost gate only. full, reboot-pre, or reboot-post runs the guest proof.
        required: false
        type: string
        default: ""
      pe_git_sha:
        description: Phantom Engine git tip for the guest proof. Ignored when proof_slice is empty.
        required: false
        type: string
        default: ""
      run_go:
        description: Run go for the guest proof. Masked. Ignored when proof_slice is empty.
        required: false
        type: string
        default: ""
      host_name:
        description: Guest hostname for the proof. Masked. Ignored when proof_slice is empty.
        required: false
        type: string
        default: ""
      instance_name:
        description: Required for reboot-post. Empty otherwise.
        required: false
        type: string
        default: ""
      stop_after_minutes:
        description: Guest shutdown delay for the proof.
        required: false
        type: string
        default: ""
      uninstall_approval:
        description: Optional uninstall approval. Masked. Empty is allowed.
        required: false
        type: string
        default: ""
      stage4:
        description: 1 runs the stage 4 lab jobs in this file. Empty skips them.
        required: false
        type: string
        default: ""
      soak_minutes:
        description: Stage 4 health-check minutes. Ignored unless stage4 is 1.
        required: false
        type: string
        default: "60"
      ds_ref:
        description: >-
          Stage 4 DS ref or sha. Recorded only. Ignored unless stage4 is 1.
        required: false
        type: string
        default: ""
    outputs:
      expected_oop_usd:
        description: Zero only when the lab cap check passes.
        value: ${{ jobs.gate.outputs.expected_oop_usd }}

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-lab-cost-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Abort unless expected out-of-pocket is $0
    if: ${{ inputs.proof_slice == '' || inputs.proof_slice == null }}
    # VANTIO_ENROLLED_RUNNER=true selects [self-hosted, vantio-enrolled]. Otherwise ubuntu-latest.
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: gcp-lab
    timeout-minutes: 10
    outputs:
      expected_oop_usd: ${{ steps.eval.outputs.expected_oop_usd }}
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|workflow_call) ;;
            *) echo "unexpected event $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac

      - name: Refuse static GCP keys
        env:
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
          GCP_LAB_SERVICE_ACCOUNT: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi
          test -n "$GCP_LAB_PROJECT"
          test -n "$GCP_LAB_WIF_PROVIDER"
          test -n "$GCP_LAB_SERVICE_ACCOUNT"

      - name: Checkout gate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/gcp/lab_auto.py
            scripts/gcp/lab_capabilities.json
          sparse-checkout-cone-mode: false

      - name: Authenticate with workload identity
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Evaluate the lab cap
        id: eval
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
        run: |
          set -euo pipefail
          vantio run python3 scripts/gcp/lab_auto.py cost-gate | tee "$RUNNER_TEMP/gcp-lab-cost-gate.json"
          vantio run python3 - "$RUNNER_TEMP/gcp-lab-cost-gate.json" "$GITHUB_OUTPUT" << 'PY'
          import json, sys
          decision = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(f"expected_oop_usd={decision['expected_oop_usd']}\n")
          if decision["expected_oop_usd"] != "0":
              raise SystemExit(2)
          PY

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-cost-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-cost-gate.json
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-cost-gate-gate
          path: optics-observe-log
          if-no-files-found: warn

  prove:
    name: Install and run the proof on a fresh guest
    if: ${{ inputs.proof_slice == 'full' || inputs.proof_slice == 'reboot-pre' || inputs.proof_slice == 'reboot-post' }}
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: gcp-lab
    timeout-minutes: 110
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|workflow_call) ;;
            *) echo "event" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKFLOW_REF" in
            vantioai/vantio-open-core/.github/workflows/gcp-lab-cost-gate.yml@refs/heads/main) ;;
            vantioai/vantio-open-core/.github/workflows/gcp-lab-enforcement-proof.yml@refs/heads/main) ;;
            *) echo "workflow_ref" >&2; exit 1 ;;
          esac

      - name: Mask the run go and host name
        env:
          PROOF_RUN_GO: ${{ inputs.run_go }}
          PROOF_HOST_NAME: ${{ inputs.host_name }}
          PROOF_UNINSTALL_APPROVAL: ${{ inputs.uninstall_approval }}
        run: |
          set -euo pipefail
          mask() {
            local name="$1"
            local value="$2"
            local required="$3"
            case "$value" in
              *$'\n'*|*$'\r'*) echo "${name}_refused" >&2; exit 1 ;;
            esac
            if [ -z "$value" ]; then
              if [ "$required" = "yes" ]; then
                echo "${name}_missing" >&2
                exit 1
              fi
              return 0
            fi
            printf '%s\n' "::add-mask::${value}"
          }
          mask run_go "$PROOF_RUN_GO" yes
          mask host_name "$PROOF_HOST_NAME" yes
          mask uninstall_approval "${PROOF_UNINSTALL_APPROVAL:-}" no

      - name: Refuse static GCP keys
        env:
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
          GCP_LAB_SERVICE_ACCOUNT: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"
          test "$GCP_LAB_SERVICE_ACCOUNT" = "vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the built loader
        if: inputs.proof_slice != 'reboot-post'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gcp-lab-pe-loader-${{ github.run_id }}
          path: ${{ runner.temp }}/pe-loader

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Check the proof inputs
        env:
          PROOF_SLICE: ${{ inputs.proof_slice }}
          PROOF_RUN_GO: ${{ inputs.run_go }}
          PROOF_HOST_NAME: ${{ inputs.host_name }}
          PROOF_UNINSTALL_APPROVAL: ${{ inputs.uninstall_approval }}
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
          PE_GIT_SHA: ${{ inputs.pe_git_sha }}
          INSTANCE_NAME: ${{ inputs.instance_name }}
        run: |
          set -euo pipefail
          vantio run python3 scripts/gcp/enforcement_proof.py precheck

      - name: Download pinned offline packages
        if: inputs.proof_slice != 'reboot-post'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          vantio run bash scripts/gcp/fetch_offline_debs.sh "${{ runner.temp }}/offline-debs"

      - name: Authenticate as vantio-lab-gha
        id: auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Bind the provider to vantio-lab-oct08
        env:
          GCP_LAB_WIF_PROVIDER: ${{ env.GCP_LAB_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          number=$(vantio run gcloud projects describe vantio-lab-oct08 --format='value(projectNumber)')
          test -n "$number"
          test "$GCP_LAB_WIF_PROVIDER" = "projects/${number}/locations/global/workloadIdentityPools/github-actions/providers/github"

      - name: Run the enforcement proof on the guest
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
          PROOF_SLICE: ${{ inputs.proof_slice }}
          PROOF_RUN_GO: ${{ inputs.run_go }}
          PROOF_HOST_NAME: ${{ inputs.host_name }}
          PROOF_UNINSTALL_APPROVAL: ${{ inputs.uninstall_approval }}
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
          PE_GIT_SHA: ${{ inputs.pe_git_sha }}
          LOADER_DIR: ${{ runner.temp }}/pe-loader
          DEB_DIR: ${{ runner.temp }}/offline-debs
          INSTANCE_NAME: ${{ inputs.instance_name }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          vantio run python3 scripts/gcp/lab_auto.py cost-gate | tee "$EVIDENCE_DIR/cost-gate.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if d.get("expected_oop_usd")=="0" and d.get("abort") is False else 2)' "$EVIDENCE_DIR/cost-gate.json"
          GCP_LAB_GATE_JSON="$(cat "$EVIDENCE_DIR/cost-gate.json")"
          export GCP_LAB_GATE_JSON
          vantio run python3 scripts/gcp/enforcement_proof.py run

      - name: Remove the OS Login key
        if: always() && steps.auth.outcome == 'success'
        run: vantio run python3 scripts/gcp/offline_deliver.py remove-oslogin-key

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-enforcement-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-evidence/
          retention-days: 5
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-enforcement-proof-prove
          path: optics-observe-log
          if-no-files-found: warn

  teardown-on-failure:
    name: Delete the VM when the proof stops
    needs: prove
    if: ${{ always() && needs.prove.result == 'failure' }}
    runs-on: ${{ fromJSON(vars.VANTIO_ENROLLED_RUNNER == 'true' && '["self-hosted", "vantio-enrolled"]' || '"ubuntu-latest"') }}
    environment: gcp-lab
    timeout-minutes: 25
    steps:
      - name: Require main on vantio-open-core
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "vantioai/vantio-open-core"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|workflow_call) ;;
            *) echo "event" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKFLOW_REF" in
            vantioai/vantio-open-core/.github/workflows/gcp-lab-cost-gate.yml@refs/heads/main) ;;
            vantioai/vantio-open-core/.github/workflows/gcp-lab-enforcement-proof.yml@refs/heads/main) ;;
            *) echo "workflow_ref" >&2; exit 1 ;;
          esac

      - name: Refuse static GCP keys
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${GCP_SA_KEY:-}" ] || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static GCP credentials are present" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Optics observe CLI
        id: optics-install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/vantio-npm"
          mkdir -p "$prefix"
          if ! command -v npm >/dev/null 2>&1; then
            echo "vantio CLI install failed: npm is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "vantio CLI install failed: python3 is not on PATH. Optics cannot observe this job." >&2
            exit 1
          fi
          if ! npm install -g --prefix "$prefix" @vantio/cli; then
            echo "vantio CLI install failed: npm install -g --prefix ${prefix} @vantio/cli" >&2
            exit 1
          fi
          if ! "$prefix/bin/vantio" --version >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not runnable at ${prefix}/bin/vantio." >&2
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          if ! python3 -m pip install --disable-pip-version-check --user vantio-agent-sdk; then
            echo "vantio CLI install: pip --user failed. Retrying with --break-system-packages." >&2
            if ! python3 -m pip install --disable-pip-version-check --user --break-system-packages vantio-agent-sdk; then
              echo "vantio CLI install failed: python3 -m pip install --user vantio-agent-sdk" >&2
              exit 1
            fi
          fi
          if ! python3 -c 'import vantio'; then
            echo "vantio CLI install failed: python3 cannot import vantio after pip install vantio-agent-sdk." >&2
            exit 1
          fi

      - name: Authenticate as vantio-lab-gha
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Delete the proof VM
        env:
          GCP_LAB_EXECUTE: "1"
          GCP_LAB_PROJECT: ${{ env.GCP_LAB_PROJECT }}
          PROOF_SLICE: ${{ inputs.proof_slice }}
          INSTANCE_NAME: ${{ inputs.instance_name }}
          EVIDENCE_DIR: ${{ runner.temp }}/gcp-lab-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          vantio run python3 scripts/gcp/enforcement_proof.py teardown

      - name: Upload teardown evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gcp-lab-enforcement-proof-teardown-${{ github.run_id }}
          path: ${{ runner.temp }}/gcp-lab-evidence/
          if-no-files-found: warn

      - name: Collect Optics observation log
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.optics-install.outcome }}" != "success" ]; then
            echo "vantio CLI install failed: Optics observe CLI was not installed, so this job cannot record an observation." >&2
            exit 1
          fi
          if ! command -v vantio >/dev/null 2>&1; then
            echo "vantio CLI install failed: vantio is not on PATH while collecting Optics logs." >&2
            exit 1
          fi
          mkdir -p optics-observe-log
          if [ -d "${HOME}/.vantio/runs" ]; then
            cp -a "${HOME}/.vantio/runs/." optics-observe-log/
          fi
          found=0
          shopt -s nullglob
          for run_file in optics-observe-log/*; do
            if [ -e "$run_file" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Optics wrote no run file under ${HOME}/.vantio/runs." >&2
            echo "A Node process wrapped with vantio run writes a file when that process exits." >&2
            echo "A Python process writes a file only after an in-scope call. Registry, cloud, and GitHub calls are outside that set." >&2
          fi

      - name: Upload Optics observation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optics-observe-gcp-lab-enforcement-proof-teardown-on-failure
          path: optics-observe-log
          if-no-files-found: warn

  stage4-target:
    name: Stage 4 ${{ matrix.role }}
    needs: gate
    if: >-
      ${{ inputs.stage4 == '1' && needs.gate.result == 'success' &&
      needs.gate.outputs.expected_oop_usd == '0' }}
    runs-on: ubuntu-latest
    environment: gcp-lab
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        role: [debian, ubuntu, refuse]
    steps:
      - name: Refuse static GCP keys
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] \
            || [ -n "${GCP_SA_KEY:-}" ] \
            || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static_credentials" >&2
            exit 1
          fi
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"
          test "$GCP_LAB_SERVICE_ACCOUNT" = "vantio-lab-gha@vantio-lab-oct08.iam.gserviceaccount.com"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mask dispatch inputs
        env:
          RUN_GO: ${{ inputs.run_go }}
          HOST_NAME: ${{ inputs.host_name }}
        run: |
          set -euo pipefail
          python3 scripts/lab/stage4_plan.py mask-lines

      - name: Download the runner-built loader
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage4-loader-${{ github.run_id }}
          path: loader-out

      - name: Authenticate with workload identity
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Run the lab role
        env:
          GCP_LAB_EXECUTE: "1"
          ROLE: ${{ matrix.role }}
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
          RUN_GO: ${{ inputs.run_go }}
          HOST_NAME: ${{ inputs.host_name }}
          DS_REF: ${{ inputs.ds_ref }}
          LOADER_DIR: loader-out
          PE_GIT_SHA: ${{ inputs.pe_git_sha }}
          HARNESS_CANDIDATES: .
          STAGE4_AFTER_AUTH: "1"
        run: python3 scripts/lab/stage4_drive.py target

      - name: DS hold
        if: always()
        env:
          DS_REF: ${{ inputs.ds_ref }}
          RUN_GO: ${{ inputs.run_go }}
        run: |
          set -euo pipefail
          python3 scripts/lab/stage4_plan.py ds-hold | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage4-${{ matrix.role }}-${{ github.run_id }}
          path: stage4-logs/
          if-no-files-found: warn
          retention-days: 5

  stage4-teardown:
    name: Delete this stage 4 run
    needs: stage4-target
    if: ${{ always() && inputs.stage4 == '1' }}
    runs-on: ubuntu-latest
    environment: gcp-lab
    timeout-minutes: 20
    steps:
      - name: Refuse static GCP keys
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] \
            || [ -n "${GCP_SA_KEY:-}" ] \
            || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static_credentials" >&2
            exit 1
          fi
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate with workload identity
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: Delete labelled resources
        env:
          GCP_LAB_EXECUTE: "1"
        run: python3 scripts/lab/stage4_drive.py teardown

  stage4-verify:
    name: Assert this stage 4 run is gone
    needs: stage4-teardown
    if: ${{ always() && inputs.stage4 == '1' }}
    runs-on: ubuntu-latest
    environment: gcp-lab
    timeout-minutes: 15
    steps:
      - name: Refuse static GCP keys
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] \
            || [ -n "${GCP_SA_KEY:-}" ] \
            || [ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]; then
            echo "static_credentials" >&2
            exit 1
          fi
          test "$GCP_LAB_PROJECT" = "vantio-lab-oct08"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate with workload identity
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ env.GCP_LAB_WIF_PROVIDER }}
          service_account: ${{ env.GCP_LAB_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"

      - name: List by label and fail if any remain
        env:
          GCP_LAB_EXECUTE: "1"
        run: python3 scripts/lab/stage4_drive.py verify
