# Example: run a Node process under Optics and persist local run logs.
# Build context is this directory. It does not send the repository root.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.observe
    volumes:
      - vantio-runs:/root/.vantio/runs

  # Optional: read the local run logs the agent service wrote.
  prove:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    volumes:
      - vantio-runs:/root/.vantio/runs
    working_dir: /root
    entrypoint: ["bash", "-lc"]
    command:
      - npm install -g @vantio/cli@0.3.24 && vantio prove --format=md --list

volumes:
  vantio-runs:
