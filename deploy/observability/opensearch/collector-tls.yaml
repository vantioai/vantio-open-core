receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  opensearch:
    http:
      endpoint: https://host.docker.internal:9243
      tls:
        ca_file: /certs/ca.pem
        cert_file: /certs/client.pem
        key_file: /certs/client.key
    traces_index: vantio-traces-tls
    logs_index: vantio-logs-tls
    bulk_action: index
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [opensearch]
    logs:
      receivers: [otlp]
      exporters: [opensearch]
