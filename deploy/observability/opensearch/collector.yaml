receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
exporters:
  debug:
    verbosity: basic
  elasticsearch:
    endpoint: http://host.docker.internal:9200
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, elasticsearch]
    logs:
      receivers: [otlp]
      exporters: [debug, elasticsearch]
