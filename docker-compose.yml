version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vantio_admin
      POSTGRES_PASSWORD: vantio_secure_password
      POSTGRES_DB: vantio_oracle
    ports:
      - "5432:5432"
    volumes:
      - vantio_pg_data:/var/lib/postgresql/data

volumes:
  vantio_pg_data:
